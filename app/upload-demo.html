<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Demo - File Processing</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.unified"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Text",
            "sap/m/Button",
            "sap/m/MessageToast",
            "sap/m/MessageBox",
            "sap/m/Panel",
            "sap/ui/unified/FileUploader",
            "sap/ui/core/Icon",
            "sap/m/Table",
            "sap/m/Column",
            "sap/m/ColumnListItem",
            "sap/m/Label",
            "sap/m/ObjectStatus",
            "sap/ui/model/json/JSONModel"
        ], function (App, Page, VBox, HBox, Title, Text, Button, MessageToast, MessageBox, Panel, FileUploader, Icon, Table, Column, ColumnListItem, Label, ObjectStatus, JSONModel) {

            // Results model
            var oResultsModel = new JSONModel({
                uploadResult: null,
                documents: [],
                visible: false
            });

            // File upload handlers
            var oFileUploader = new FileUploader({
                name: "fileUpload",
                uploadUrl: "upload",
                width: "100%",
                placeholder: "Choose file(s)...",
                fileType: ["pdf", "eml", "zip"],
                buttonText: "Browse...",
                multiple: false,
                change: function(oEvent) {
                    var sFileName = oEvent.getParameter("newValue");
                    if (sFileName) {
                        MessageToast.show("Selected: " + sFileName);
                    }
                }
            });

            // Upload button
            var oUploadButton = new Button({
                text: "Upload File",
                icon: "sap-icon://upload",
                type: "Emphasized",
                width: "200px",
                press: function() {
                    var file = oFileUploader.oFileUpload.files[0];

                    if (!file) {
                        MessageBox.error("Please select a file first");
                        return;
                    }

                    MessageToast.show("Uploading " + file.name + "...");
                    oUploadButton.setEnabled(false);
                    oResultsModel.setProperty("/visible", false);

                    // Read file as base64
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var base64Content = e.target.result.split(',')[1];

                        // Call upload endpoint
                        fetch("/invoice/uploadFile", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                fileName: file.name,
                                fileContent: base64Content,
                                mimeType: file.type || (file.name.endsWith('.eml') ? 'message/rfc822' : file.name.endsWith('.zip') ? 'application/zip' : 'application/pdf'),
                                schemaId: null
                            })
                        })
                        .then(function(response) {
                            if (!response.ok) {
                                throw new Error("Upload failed: " + response.statusText);
                            }
                            return response.json();
                        })
                        .then(function(data) {
                            // Update results model
                            oResultsModel.setProperty("/uploadResult", {
                                batchId: data.ID,
                                fileName: data.fileName,
                                fileType: data.fileType,
                                totalDocuments: data.totalDocuments,
                                status: data.status
                            });

                            // Fetch documents for this batch
                            return fetch("/invoice/ProcessingBatches('" + data.ID + "')?$expand=documents");
                        })
                        .then(function(response) {
                            return response.json();
                        })
                        .then(function(batchData) {
                            var documents = batchData.documents || [];
                            oResultsModel.setProperty("/documents", documents);
                            oResultsModel.setProperty("/visible", true);

                            MessageToast.show("Upload complete! Extracted " + documents.length + " documents");
                            oFileUploader.clear();
                            oUploadButton.setEnabled(true);

                            // Scroll to results
                            setTimeout(function() {
                                oResultsPanel.getDomRef().scrollIntoView({ behavior: 'smooth' });
                            }, 300);
                        })
                        .catch(function(error) {
                            MessageBox.error("Upload failed: " + error.message);
                            oUploadButton.setEnabled(true);
                        });
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Supported file types panel
            var oFileTypesPanel = new Panel({
                headerText: "Supported File Types",
                expandable: true,
                expanded: true,
                content: new VBox({
                    items: [
                        new HBox({
                            items: [
                                new Icon({
                                    src: "sap-icon://pdf-attachment",
                                    size: "2rem",
                                    color: "#bb0000"
                                }).addStyleClass("sapUiTinyMarginEnd"),
                                new VBox({
                                    items: [
                                        new Title({ text: "PDF Files", level: "H4" }),
                                        new Text({ text: "Single invoice PDF documents. Extracted and processed directly." })
                                    ]
                                })
                            ],
                            alignItems: "Center"
                        }).addStyleClass("sapUiSmallMarginBottom"),

                        new HBox({
                            items: [
                                new Icon({
                                    src: "sap-icon://email",
                                    size: "2rem",
                                    color: "#0070f2"
                                }).addStyleClass("sapUiTinyMarginEnd"),
                                new VBox({
                                    items: [
                                        new Title({ text: "EML Files (Email)", level: "H4" }),
                                        new Text({ text: "Email files with invoice attachments. All PDF attachments are extracted automatically." })
                                    ]
                                })
                            ],
                            alignItems: "Center"
                        }).addStyleClass("sapUiSmallMarginBottom"),

                        new HBox({
                            items: [
                                new Icon({
                                    src: "sap-icon://attachment-zip-file",
                                    size: "2rem",
                                    color: "#f0ab00"
                                }).addStyleClass("sapUiTinyMarginEnd"),
                                new VBox({
                                    items: [
                                        new Title({ text: "ZIP Files", level: "H4" }),
                                        new Text({ text: "Compressed archives containing multiple invoices. All files are extracted and processed." })
                                    ]
                                })
                            ],
                            alignItems: "Center"
                        }).addStyleClass("sapUiSmallMarginBottom"),

                        new HBox({
                            items: [
                                new Icon({
                                    src: "sap-icon://chain-link",
                                    size: "2rem",
                                    color: "#107e3e"
                                }).addStyleClass("sapUiTinyMarginEnd"),
                                new VBox({
                                    items: [
                                        new Title({ text: "Email with ZIP", level: "H4" }),
                                        new Text({ text: "EML files containing ZIP attachments. Fully supported with nested extraction." })
                                    ]
                                })
                            ],
                            alignItems: "Center"
                        })
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginTop");

            // Results table
            var oDocumentsTable = new Table({
                width: "100%",
                columns: [
                    new Column({
                        header: new Label({ text: "#" }),
                        width: "50px"
                    }),
                    new Column({
                        header: new Label({ text: "File Name" }),
                        width: "40%"
                    }),
                    new Column({
                        header: new Label({ text: "Status" }),
                        width: "20%"
                    }),
                    new Column({
                        header: new Label({ text: "Uploaded At" }),
                        width: "40%"
                    })
                ],
                items: {
                    path: "results>/documents",
                    template: new ColumnListItem({
                        cells: [
                            new Text({
                                text: {
                                    path: "results>",
                                    formatter: function(oContext) {
                                        var aItems = this.getModel("results").getProperty("/documents");
                                        return (aItems.indexOf(oContext) + 1).toString();
                                    }
                                }
                            }),
                            new Text({ text: "{results>fileName}" }),
                            new ObjectStatus({
                                text: "{results>status}",
                                state: {
                                    path: "results>status",
                                    formatter: function(status) {
                                        if (status === "extracted") return "Success";
                                        if (status === "failed") return "Error";
                                        return "None";
                                    }
                                }
                            }),
                            new Text({
                                text: {
                                    path: 'results>uploadedAt',
                                    formatter: function(date) {
                                        if (!date) return '';
                                        return new Date(date).toLocaleString();
                                    }
                                }
                            })
                        ]
                    })
                }
            }).setModel(oResultsModel, "results");

            // Results panel
            var oResultsPanel = new Panel({
                headerText: "Processing Results",
                visible: "{results>/visible}",
                content: new VBox({
                    items: [
                        new Title({ text: "Upload Summary", level: "H4" }),
                        new HBox({
                            items: [
                                new Label({ text: "Batch ID:", width: "150px" }).addStyleClass("sapUiTinyMarginEnd"),
                                new Text({ text: "{results>/uploadResult/batchId}" })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Label({ text: "Original File:", width: "150px" }).addStyleClass("sapUiTinyMarginEnd"),
                                new Text({ text: "{results>/uploadResult/fileName}" })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Label({ text: "File Type:", width: "150px" }).addStyleClass("sapUiTinyMarginEnd"),
                                new Text({ text: "{results>/uploadResult/fileType}" })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Label({ text: "Documents Extracted:", width: "150px" }).addStyleClass("sapUiTinyMarginEnd"),
                                new Text({
                                    text: "{results>/uploadResult/totalDocuments}",
                                    renderWhitespace: true
                                })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Label({ text: "Status:", width: "150px" }).addStyleClass("sapUiTinyMarginEnd"),
                                new ObjectStatus({
                                    text: "{results>/uploadResult/status}",
                                    state: {
                                        path: "results>/uploadResult/status",
                                        formatter: function(status) {
                                            if (status === "completed") return "Success";
                                            if (status === "failed") return "Error";
                                            return "Information";
                                        }
                                    }
                                })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),

                        new Title({ text: "Extracted Documents", level: "H4" }).addStyleClass("sapUiMediumMarginTop"),
                        oDocumentsTable
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).setModel(oResultsModel, "results").addStyleClass("sapUiMediumMarginTop");

            // Features panel
            var oFeaturesPanel = new Panel({
                headerText: "Processing Features",
                expandable: true,
                expanded: false,
                content: new VBox({
                    items: [
                        new Text({ text: "✅ Automatic file type detection" }),
                        new Text({ text: "✅ Multi-file extraction from containers (ZIP, EML)" }).addStyleClass("sapUiTinyMarginTop"),
                        new Text({ text: "✅ Nested archive support (ZIP in EML)" }).addStyleClass("sapUiTinyMarginTop"),
                        new Text({ text: "✅ PDF attachment parsing" }).addStyleClass("sapUiTinyMarginTop"),
                        new Text({ text: "✅ Batch processing tracking" }).addStyleClass("sapUiTinyMarginTop"),
                        new Text({ text: "✅ Individual document status" }).addStyleClass("sapUiTinyMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginTop");

            // Main content
            var oMainContent = new VBox({
                width: "100%",
                alignItems: "Center",
                items: [
                    new VBox({
                        width: "800px",
                        items: [
                            new Title({
                                text: "Upload Demo",
                                level: "H2"
                            }).addStyleClass("sapUiMediumMarginTop"),
                            new Text({
                                text: "Demonstration of file upload capabilities with support for PDF, EML, and ZIP files"
                            }).addStyleClass("sapUiTinyMarginTop sapUiSmallMarginBottom"),

                            new Panel({
                                headerText: "Upload File",
                                content: new VBox({
                                    items: [
                                        new Text({
                                            text: "Select a file to upload. Supported formats: PDF, EML (email), ZIP archives"
                                        }).addStyleClass("sapUiSmallMarginBottom"),
                                        oFileUploader
                                    ]
                                }).addStyleClass("sapUiSmallMargin")
                            }).addStyleClass("sapUiSmallMarginBottom"),

                            new HBox({
                                width: "100%",
                                justifyContent: "Center",
                                items: [oUploadButton]
                            }).addStyleClass("sapUiSmallMarginBottom"),

                            oResultsPanel,
                            oFileTypesPanel,
                            oFeaturesPanel,

                            new Panel({
                                headerText: "How It Works",
                                expandable: true,
                                expanded: false,
                                content: new VBox({
                                    items: [
                                        new Title({ text: "Processing Flow", level: "H4" }),
                                        new Text({ text: "1. Upload → File is received and analyzed" }).addStyleClass("sapUiTinyMarginTop"),
                                        new Text({ text: "2. Extract → PDFs are extracted from containers (EML, ZIP)" }).addStyleClass("sapUiTinyMarginTop"),
                                        new Text({ text: "3. Parse → Each PDF is parsed for invoice data" }).addStyleClass("sapUiTinyMarginTop"),
                                        new Text({ text: "4. Process → Documents are sent to DocAI for extraction" }).addStyleClass("sapUiTinyMarginTop"),
                                        new Text({ text: "5. Track → Processing status is monitored per document" }).addStyleClass("sapUiTinyMarginTop")
                                    ]
                                }).addStyleClass("sapUiSmallMargin")
                            }).addStyleClass("sapUiSmallMarginTop"),

                            new Panel({
                                headerText: "Next Steps",
                                content: new VBox({
                                    items: [
                                        new Text({
                                            text: "After extraction, documents can be processed through the DocAI Workbench for full invoice data extraction and validation.",
                                            wrapping: true
                                        }),
                                        new Button({
                                            text: "Go to DocAI Workbench",
                                            icon: "sap-icon://business-card",
                                            press: function() {
                                                window.location.href = "/docai-test.html";
                                            }
                                        }).addStyleClass("sapUiSmallMarginTop")
                                    ]
                                }).addStyleClass("sapUiSmallMargin")
                            }).addStyleClass("sapUiMediumMarginTop")
                        ]
                    })
                ]
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                title: "Upload Demo - File Processing",
                showHeader: true,
                showNavButton: true,
                navButtonPress: function() {
                    window.location.href = "/";
                },
                content: [oMainContent]
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>
</html>
