                        new HBox({
                            items: [
                                oCheckStatusButton,
                                oGetResultsButton.addStyleClass("sapUiTinyMarginBegin"),
                                new Button({
                                    text: "Start Polling",
                                    icon: "sap-icon://play",
                                    press: startPolling
                                }).addStyleClass("sapUiTinyMarginBegin"),
                                new Button({
                                    text: "Stop Polling",
                                    icon: "sap-icon://stop",
                                    press: stopPolling
                                }).addStyleClass("sapUiTinyMarginBegin")
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Response panel
            var oResponsePanel = new Panel({
                headerText: "Document Log",
                expandable: true,
                expanded: true,
                content: new VBox({
                    items: [
                        oResponseArea
                    ]
                }).addStyleClass("sapUiSmallMargin")
            });

            // Extraction Results panel
            var oExtractionResultsContent = new VBox({
                items: []
            }).addStyleClass("sapUiSmallMargin");

            var oConfirmButton = new Button({
                text: "Confirm",
                type: "Emphasized",
                icon: "sap-icon://accept",
                enabled: false,
                press: confirmDocument
            });

            var oExtractionResultsPanel = new Panel({
                headerText: "Extraction Results",
                expandable: true,
                expanded: true,
                visible: false,
                content: new VBox({
                    items: [
                        oExtractionResultsContent,
                        new HBox({
                            alignItems: "Center",
                            items: [
                                oConfirmButton,
                                oPostToS4Button.addStyleClass("sapUiTinyMarginBegin")
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // PDF Viewer panel
            var oPdfViewerPanel = new Panel({
                headerText: "PDF Document",
                expandable: true,
                expanded: true,
                visible: false,
                content: new HTML({
                    content: '<iframe id="pdfViewer" style="width:100%; height:800px; border:none;"></iframe>'
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Main content
            // List View Container
            var oListViewContainer = new VBox({
                width: "95%",
                visible: true,
                items: [
                    new Title({
                        text: "DocAI Multi-Document Workbench",
                        level: "H2"
                    }).addStyleClass("sapUiMediumMarginTop"),
                    new Text({
                        text: "Upload and process multiple documents with SAP Document Information Extraction API v4"
                    }).addStyleClass("sapUiTinyMarginTop sapUiSmallMarginBottom"),
                    oConfigPanel,
                    oUploadPanel,
                    oDocumentsPanel
                ]
            });

            // Detail View Container
            var oDetailViewContainer = new VBox({
                width: "95%",
                visible: false,
                items: [
                    new HBox({
                        width: "100%",
                        justifyContent: "SpaceBetween",
                        alignItems: "Center",
                        items: [
                            new Title({
                                text: "Document Details",
                                level: "H2"
                            }),
                            new Button({
                                text: "Back to List",
                                icon: "sap-icon://nav-back",
                                press: switchToListView
                            })
                        ]
                    }).addStyleClass("sapUiMediumMarginTop sapUiSmallMarginBottom"),
                    oStatusPanel,
                    oPdfViewerPanel,
                    oExtractionResultsPanel,
                    oResponsePanel
                ]
            });

            // Main content
            var oMainContent = new VBox({
                width: "100%",
                items: [
                    oListViewContainer,
                    oDetailViewContainer
                ],
                alignItems: "Center"
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                title: "DocAI Multi-Document Workbench",
                showHeader: true,
                showNavButton: true,
                navButtonPress: function() {
                    stopPolling();
                    window.location.href = "./index.html";
                },
                content: [oMainContent]
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");

            // Cleanup on page unload
            window.addEventListener('beforeunload', function() {
                stopPolling();
            });
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>
</html>
