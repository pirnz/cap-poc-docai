<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAI Multi-Document Workbench</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.unified"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Label",
            "sap/m/Text",
            "sap/m/Input",
            "sap/m/TextArea",
            "sap/m/Button",
            "sap/m/MessageToast",
            "sap/m/MessageBox",
            "sap/m/ProgressIndicator",
            "sap/m/Panel",
            "sap/ui/core/Icon",
            "sap/ui/unified/FileUploader",
            "sap/m/ObjectStatus",
            "sap/m/ComboBox",
            "sap/m/Select",
            "sap/ui/core/Item",
            "sap/ui/model/json/JSONModel",
            "sap/ui/core/HTML",
            "sap/m/Table",
            "sap/m/Column",
            "sap/m/ColumnListItem",
            "sap/m/FlexItemData"
        ], function (App, Page, VBox, HBox, Title, Label, Text, Input, TextArea, Button, MessageToast, MessageBox, ProgressIndicator, Panel, Icon, FileUploader, ObjectStatus, ComboBox, Select, Item, JSONModel, HTML, Table, Column, ColumnListItem, FlexItemData) {

            // State variables
            var currentDocumentId = null;
            var currentSchemaVersionId = null;
            var currentDocumentStatus = null;
            var pollingInterval = null;
            var schemaFields = {};
            var documentEntities = { headerFields: [], lineItems: [], documentConfidence: 0 };
            var editedEntities = {};
            var pdfData = null;


            // JSON model for clients
            var oClientsModel = new JSONModel({
                clients: [],
                selectedClient: null,
                loading: false
            });

            // JSON model for schema versions
            var oSchemaVersionsModel = new JSONModel({
                schemaVersions: [],
                selectedSchemaVersionId: null,
                loading: false
            });

            // JSON model for documents management
            var oDocumentsModel = new JSONModel({
                documents: [],
                currentDocumentId: null,
                view: "list"
            });

            // Helper function: Generate UUID
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0;
                    var v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // Helper function: Add document
            function addDocument(fileName, schemaVersionId, clientId) {
                var documents = oDocumentsModel.getProperty("/documents");
                var newDoc = {
                    id: generateUUID(),
                    fileName: fileName,
                    documentId: null,
                    schemaVersionId: schemaVersionId,
                    clientId: clientId,
                    status: "pending",
                    extractionStatus: null,
                    uploadedAt: new Date().toISOString(),
                    logs: [],
                    headerFields: [],
                    lineItems: [],
                    documentConfidence: 0,
                    pdfData: null,
                    editedEntities: {}
                };
                documents.push(newDoc);
                oDocumentsModel.setProperty("/documents", documents);
                return newDoc;
            }

            // Helper function: Update document
            function updateDocument(docId, updates) {
                var documents = oDocumentsModel.getProperty("/documents");
                var docIndex = documents.findIndex(function(d) { return d.id === docId; });
                if (docIndex !== -1) {
                    var doc = documents[docIndex];
                    Object.keys(updates).forEach(function(key) {
                        doc[key] = updates[key];
                    });
                    documents[docIndex] = doc;
                    oDocumentsModel.setProperty("/documents", documents);
                    return doc;
                }
                return null;
            }

            // Helper function: Get current document
            function getCurrentDocument() {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                if (!currentDocId) return null;
                var documents = oDocumentsModel.getProperty("/documents");
                return documents.find(function(d) { return d.id === currentDocId; });
            }

            // Helper function: Update progress indicator for document
            function updateProgressForDocument(doc) {
                if (!doc) return;

                oProgress.setVisible(true);

                var status = doc.status;
                if (status === "pending") {
                    oProgress.setPercentValue(0);
                    oProgress.setState("None");
                    oProgress.setDisplayValue("Pending upload");
                } else if (status === "uploading") {
                    oProgress.setPercentValue(30);
                    oProgress.setState("Information");
                    oProgress.setDisplayValue("Uploading...");
                } else if (status === "PENDING" || status === "processing") {
                    oProgress.setPercentValue(50);
                    oProgress.setState("Information");
                    oProgress.setDisplayValue("Processing...");
                } else if (status === "reviewNeeded") {
                    oProgress.setPercentValue(80);
                    oProgress.setState("Warning");
                    oProgress.setDisplayValue("Review needed");
                } else if (status === "confirmed" || status === "readyForPosting") {
                    oProgress.setPercentValue(100);
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Confirmed");
                } else if (status === "failed" || status === "ERROR" || status === "FAILED") {
                    oProgress.setPercentValue(100);
                    oProgress.setState("Error");
                    oProgress.setDisplayValue("Failed");
                } else {
                    oProgress.setPercentValue(70);
                    oProgress.setState("Information");
                    oProgress.setDisplayValue(status || "Processing");
                }
            }

            // Helper function: Switch to list view
            function switchToListView() {
                oDocumentsModel.setProperty("/view", "list");
                oDocumentsModel.setProperty("/currentDocumentId", null);

                // Update UI visibility
                oListViewContainer.setVisible(true);
                oDetailViewContainer.setVisible(false);

                // Stop polling when leaving detail view
                stopPolling();

                // Clear detail view UI
                oDocumentIdText.setText("");
                oProgress.setVisible(false);
                oExtractionResultsPanel.setVisible(false);
                oPdfViewerPanel.setVisible(false);
            }

            // Helper function: Switch to detail view
            function switchToDetailView(docId) {
                oDocumentsModel.setProperty("/view", "detail");
                oDocumentsModel.setProperty("/currentDocumentId", docId);

                // Update UI visibility
                oListViewContainer.setVisible(false);
                oDetailViewContainer.setVisible(true);

                // Update button states for this document
                updateButtonStates();

                // Display logs for this document
                displayLogsForDocument(docId);

                // Load document data into UI
                var doc = getCurrentDocument();
                if (doc) {
                    oDocumentIdText.setText("Document ID: " + (doc.documentId || "Not uploaded yet"));

                    // Update progress indicator
                    if (doc.status) {
                        updateProgressForDocument(doc);
                    }

                    // Load results if available
                    if (doc.headerFields && doc.headerFields.length > 0) {
                        documentEntities = {
                            headerFields: doc.headerFields,
                            lineItems: doc.lineItems,
                            documentConfidence: doc.documentConfidence
                        };
                        buildResultsContent();
                        oExtractionResultsPanel.setVisible(true);

                        if (doc.pdfData) {
                            displayPdf(doc.pdfData);
                        }
                    }
                }
            }

            // Load available clients from schemas
            function loadClients() {
                oClientsModel.setProperty("/loading", true);

                fetch("./odata/invoice/getSchemaClients", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})
                })
                .then(function(response) {
                    if (!response.ok) throw new Error("Failed to load clients");
                    return response.json();
                })
                .then(function(data) {
                    var uniqueClients = data.clients || [];
                    oClientsModel.setProperty("/clients", uniqueClients);
                    oClientsModel.setProperty("/loading", false);

                    // Auto-select "default" if available
                    if (uniqueClients.indexOf("default") !== -1) {
                        oClientsModel.setProperty("/selectedClient", "default");
                        oClientComboBox.setSelectedKey("default");
                    } else if (uniqueClients.length > 0) {
                        oClientsModel.setProperty("/selectedClient", uniqueClients[0]);
                        oClientComboBox.setSelectedKey(uniqueClients[0]);
                    }

                    MessageToast.show("Loaded " + uniqueClients.length + " clients");
                })
                .catch(function(error) {
                    oClientsModel.setProperty("/loading", false);
                    MessageToast.show("Failed to load clients: " + error.message);
                });
            }

            // Load available schema versions
            function loadSchemaVersions() {
                oSchemaVersionsModel.setProperty("/loading", true);

                fetch("./odata/invoice/getSchemaVersionsList", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})
                })
                .then(function(response) {
                    if (!response.ok) throw new Error("Failed to load schema versions");
                    return response.json();
                })
                .then(function(data) {
                    var schemaVersions = (data.schemaVersions || []).map(function(sv) {
                        return JSON.parse(sv);
                    });
                    oSchemaVersionsModel.setProperty("/schemaVersions", schemaVersions);
                    oSchemaVersionsModel.setProperty("/loading", false);

                    // Auto-select first schema version if available
                    if (schemaVersions.length > 0) {
                        var firstId = schemaVersions[0].ID;
                        oSchemaVersionsModel.setProperty("/selectedSchemaVersionId", firstId);
                        oSchemaVersionSelect.setSelectedKey(firstId);
                        currentSchemaVersionId = firstId;
                    }

                    MessageToast.show("Loaded " + schemaVersions.length + " active schema versions");
                })
                .catch(function(error) {
                    oSchemaVersionsModel.setProperty("/loading", false);
                    MessageToast.show("Failed to load schema versions: " + error.message);
                });
            }

            // Client ComboBox
            var oClientComboBox = new ComboBox({
                width: "100%",
                placeholder: "Select or enter client ID",
                selectedKey: "{clients>/selectedClient}",
                change: function(oEvent) {
                    var value = oEvent.getParameter("value");
                    oClientsModel.setProperty("/selectedClient", value);
                },
                items: {
                    path: "clients>/clients",
                    template: new Item({
                        key: "{clients>}",
                        text: "{clients>}"
                    })
                }
            }).setModel(oClientsModel, "clients");

            // Refresh clients button
            var oRefreshClientsButton = new Button({
                icon: "sap-icon://refresh",
                tooltip: "Refresh clients",
                press: loadClients
            });

            // Schema version selector
            var oSchemaVersionSelect = new Select({
                width: "100%",
                selectedKey: "{schemaVersions>/selectedSchemaVersionId}",
                change: function(oEvent) {
                    var selectedKey = oEvent.getParameter("selectedItem").getKey();
                    oSchemaVersionsModel.setProperty("/selectedSchemaVersionId", selectedKey);
                    currentSchemaVersionId = selectedKey;
                },
                items: {
                    path: "schemaVersions>/schemaVersions",
                    template: new Item({
                        key: "{schemaVersions>ID}",
                        text: "{schemaVersions>label} (v{schemaVersions>version})"
                    })
                }
            }).setModel(oSchemaVersionsModel, "schemaVersions");

            // Refresh schema versions button
            var oRefreshSchemaVersionsButton = new Button({
                icon: "sap-icon://refresh",
                tooltip: "Refresh schema versions",
                press: loadSchemaVersions
            });

            // OCR Engine input
            var oOcrEngineInput = new Input({
                value: "Document",
                placeholder: "Document or SceneText",
                width: "100%"
            });

            // File uploader
            var oFileUploader = new FileUploader({
                name: "pdfFile",
                uploadUrl: "upload",
                placeholder: "Choose PDF file...",
                fileType: ["pdf"],
                mimeType: ["application/pdf"],
                buttonText: "Browse",
                width: "100%",
                change: function(oEvent) {
                    var fileName = oEvent.getParameter("newValue");
                    if (fileName) {
                        MessageToast.show("File selected: " + fileName);
                    }
                }
            });

            // Progress indicator
            var oProgress = new ProgressIndicator({
                visible: false,
                percentValue: 0,
                displayValue: "Idle",
                width: "100%",
                state: "None"
            });

            // Response display
            var oResponseArea = new TextArea({
                width: "100%",
                rows: 20,
                editable: false,
                placeholder: "API responses will appear here..."
            });

            // Document ID display
            var oDocumentIdText = new Text({
                text: ""
            }).addStyleClass("sapUiSmallMarginTop");

            // Per-document logging function
            function logForDocument(docId, message, isError) {
                if (!docId) return;

                var documents = oDocumentsModel.getProperty("/documents");
                var docIndex = documents.findIndex(function(d) { return d.id === docId; });

                if (docIndex !== -1) {
                    var doc = documents[docIndex];
                    if (!doc.logs) {
                        doc.logs = [];
                    }

                    doc.logs.push({
                        timestamp: new Date().toISOString(),
                        message: message,
                        isError: isError || false
                    });

                    documents[docIndex] = doc;
                    oDocumentsModel.setProperty("/documents", documents);
                }
            }

            // Log function
            function log(message, isError) {
                var timestamp = new Date().toLocaleTimeString();
                var prefix = isError ? "❌ ERROR" : "✅";
                var line = `[${timestamp}] ${prefix} ${message}\n`;
                oResponseArea.setValue(oResponseArea.getValue() + line);

                // Also log to current document if exists
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                if (currentDocId) {
                    logForDocument(currentDocId, message, isError);
                }
            }

            function logJson(label, data) {
                var timestamp = new Date().toLocaleTimeString();
                var line = `[${timestamp}] 📋 ${label}:\n${JSON.stringify(data, null, 2)}\n\n`;
                oResponseArea.setValue(oResponseArea.getValue() + line);

                // Also log to current document if exists
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                if (currentDocId) {
                    logForDocument(currentDocId, `${label}: ${JSON.stringify(data)}`, false);
                }
            }

            // Display logs for a specific document
            function displayLogsForDocument(docId) {
                if (!docId) {
                    oResponseArea.setValue("");
                    return;
                }

                var documents = oDocumentsModel.getProperty("/documents");
                var doc = documents.find(function(d) { return d.id === docId; });

                if (!doc || !doc.logs || doc.logs.length === 0) {
                    oResponseArea.setValue("No logs available for this document.\n");
                    return;
                }

                var logText = "";
                doc.logs.forEach(function(logEntry) {
                    var timestamp = new Date(logEntry.timestamp).toLocaleTimeString();
                    var prefix = logEntry.isError ? "❌ ERROR" : "✅";
                    logText += `[${timestamp}] ${prefix} ${logEntry.message}\n`;
                });

                oResponseArea.setValue(logText);
            }

            function clearLog() {
                // Deprecated - logs are now per-document
                // Left here for backward compatibility if needed
            }

            // Test API connection
            function testConnection() {
                oProgress.setVisible(true);
                oProgress.setState("Information");
                oProgress.setDisplayValue("Testing connection...");

                fetch("./odata/invoice/testDocAI", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({})
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        oProgress.setVisible(false);
                        MessageBox.error("Connection test failed: " + data.error.message);
                    } else {
                        oProgress.setVisible(false);
                        MessageToast.show("Connection test completed successfully");
                    }
                })
                .catch(error => {
                    oProgress.setVisible(false);
                    MessageBox.error("Connection test failed: " + error.message);
                });
            }

            // Upload document to DocAI
            function uploadDocument() {
                var domRef = oFileUploader.getDomRef();
                var file = domRef.querySelector('input[type="file"]').files[0];

                if (!file) {
                    MessageBox.warning("Please select a PDF file first");
                    return;
                }

                var selectedSchemaVersionId = oSchemaVersionsModel.getProperty("/selectedSchemaVersionId");
                var selectedClient = oClientComboBox.getValue() || oClientsModel.getProperty("/selectedClient");

                if (!selectedSchemaVersionId) {
                    MessageBox.warning("Please select a schema version");
                    return;
                }

                if (!selectedClient) {
                    MessageBox.warning("Please enter or select a client ID");
                    return;
                }

                // Create new document in the model
                var newDoc = addDocument(file.name, selectedSchemaVersionId, selectedClient);
                var newDocId = newDoc.id;

                // Switch to detail view for this document
                switchToDetailView(newDocId);

                // Update status to uploading
                updateDocument(newDocId, { status: "uploading" });
                logForDocument(newDocId, "Starting document upload: " + file.name, false);

                oProgress.setVisible(true);
                oProgress.setPercentValue(10);
                oProgress.setState("Information");
                oProgress.setDisplayValue("Reading file...");

                var reader = new FileReader();
                reader.onload = function(e) {
                    var fileContent = e.target.result.split(',')[1];

                    oProgress.setPercentValue(30);
                    oProgress.setDisplayValue("Uploading to DocAI...");

                    var requestData = {
                        schemaId: selectedSchemaVersionId,
                        clientId: selectedClient,
                        ocrEngine: oOcrEngineInput.getValue() || undefined,
                        fileName: file.name,
                        fileContent: fileContent
                    };

                    logForDocument(newDocId, "Schema Version ID: " + requestData.schemaId, false);
                    logForDocument(newDocId, "Client ID: " + requestData.clientId, false);

                    fetch("./odata/invoice/submitToDocAI", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(requestData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            throw new Error(data.error.message || "Upload failed");
                        }

                        var docAIId = data.documentId;
                        logForDocument(newDocId, "Document uploaded successfully!", false);
                        logForDocument(newDocId, "Document ID: " + docAIId, false);
                        logForDocument(newDocId, JSON.stringify(data), false);

                        // Update the document in the model
                        updateDocument(newDocId, {
                            documentId: docAIId,
                            status: "PENDING"
                        });

                        oDocumentIdText.setText("Document ID: " + docAIId);

                        oProgress.setPercentValue(50);
                        oProgress.setState("Success");
                        oProgress.setDisplayValue("Document uploaded");

                        // Update button states
                        updateButtonStates();

                        MessageToast.show("Document uploaded: " + docAIId);

                        // Auto-start polling
                        setTimeout(function() {
                            startPolling();
                        }, 2000);
                    })
                    .catch(error => {
                        logForDocument(newDocId, "Upload failed: " + error.message, true);
                        updateDocument(newDocId, { status: "failed" });
                        oProgress.setVisible(false);
                        MessageBox.error("Upload failed: " + error.message);
                    });
                };

                reader.readAsDataURL(file);
            }

            // Check document status
            function checkStatus() {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                var currentDoc = getCurrentDocument();

                if (!currentDocId || !currentDoc || !currentDoc.documentId) {
                    MessageBox.warning("No document ID. Please upload a document first.");
                    return;
                }

                logForDocument(currentDocId, "Checking status for: " + currentDoc.documentId, false);

                fetch("./odata/invoice/getDocAIStatus", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        documentId: currentDoc.documentId
                    })
                })
                .then(response => response.json())
                .then(data => {
                    var newStatus = data.status;
                    logForDocument(currentDocId, "Status retrieved: " + newStatus, false);
                    logForDocument(currentDocId, JSON.stringify(data), false);

                    // Update document with new status
                    updateDocument(currentDocId, {
                        status: newStatus,
                        extractionStatus: newStatus
                    });

                    // Update UI if we're viewing this document
                    var viewingDocId = oDocumentsModel.getProperty("/currentDocumentId");
                    if (viewingDocId === currentDocId) {
                        updateProgressForDocument(getCurrentDocument());
                        updateButtonStates();
                    }

                    if (newStatus === "DONE" || newStatus === "SUCCEEDED" || newStatus === "reviewNeeded") {
                        if (viewingDocId === currentDocId) {
                            oProgress.setPercentValue(100);
                            oProgress.setState("Success");
                            oProgress.setDisplayValue("Processing complete!");
                        }
                        stopPolling();
                        MessageBox.success("Document processing completed!");
                    } else if (newStatus === "FAILED" || newStatus === "ERROR") {
                        if (viewingDocId === currentDocId) {
                            oProgress.setState("Error");
                            oProgress.setDisplayValue("Processing failed");
                        }
                        stopPolling();
                        MessageBox.error("Document processing failed");
                    } else {
                        if (viewingDocId === currentDocId) {
                            oProgress.setPercentValue(70);
                            oProgress.setDisplayValue("Processing: " + newStatus);
                        }
                    }
                })
                .catch(error => {
                    logForDocument(currentDocId, "Status check failed: " + error.message, true);
                    MessageToast.show("Status check failed");
                });
            }

            // Poll all processing documents
            function pollAllProcessingDocuments() {
                var documents = oDocumentsModel.getProperty("/documents");
                var processingDocs = documents.filter(function(doc) {
                    return doc.documentId && (doc.status === "PENDING" || doc.status === "processing" || doc.status === "RUNNING");
                });

                if (processingDocs.length === 0) {
                    stopPolling();
                    return;
                }

                processingDocs.forEach(function(doc) {
                    fetch("./odata/invoice/getDocAIStatus", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            documentId: doc.documentId
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        var newStatus = data.status;
                        logForDocument(doc.id, "Status: " + newStatus, false);

                        // Update document with new status
                        updateDocument(doc.id, {
                            status: newStatus,
                            extractionStatus: newStatus
                        });

                        // Update UI if we're viewing this document
                        var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                        if (currentDocId === doc.id) {
                            updateProgressForDocument(getCurrentDocument());
                            updateButtonStates();
                        }

                        // If document is done, show notification
                        if (newStatus === "DONE" || newStatus === "SUCCEEDED" || newStatus === "reviewNeeded") {
                            MessageToast.show("Document " + doc.fileName + " is ready for review");
                        }
                    })
                    .catch(error => {
                        logForDocument(doc.id, "Status check failed: " + error.message, true);
                    });
                });
            }

            // Get confidence state
            function getConfidenceState(confidence) {
                if (confidence < 0.5) return "Error";
                if (confidence < 0.8) return "Warning";
                return "Success";
            }

            // Fetch schema field definitions
            function fetchSchemaFields(schemaVersionId) {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                logForDocument(currentDocId, "Fetching schema fields for version ID: " + schemaVersionId, false);

                return fetch("./odata/invoice/getSchemaFields", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        schemaVersionId: schemaVersionId
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        schemaFields = {};
                        var fields = (data.fields || []).map(f => JSON.parse(f));
                        if (fields.length > 0) {
                            fields.forEach(field => {
                                schemaFields[field.name] = {
                                    label: field.label || field.name,
                                    dataType: field.dataType,
                                    ID: field.ID
                                };
                            });
                            logForDocument(currentDocId, "Loaded " + fields.length + " schema field definitions", false);
                        }
                        return schemaFields;
                    })
                    .catch(error => {
                        logForDocument(currentDocId, "Failed to fetch schema fields: " + error.message, true);
                        throw error;
                    });
            }

            // Fetch document extraction results
            function fetchDocumentEntities(documentId) {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                logForDocument(currentDocId, "Fetching document entities for ID: " + documentId, false);

                return fetch("./odata/invoice/getDocAIResults", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        documentId: documentId
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            throw new Error(data.error.message || "Failed to fetch results");
                        }

                        // Store results in document object
                        if (currentDocId) {
                            var updates = {};

                            // Store PDF file data
                            if (data.fileData) {
                                updates.pdfData = data.fileData;
                                logForDocument(currentDocId, "PDF file data loaded", false);
                            }

                            // Store structured format
                            if (data.headerFields && data.lineItems) {
                                updates.headerFields = data.headerFields;
                                updates.lineItems = data.lineItems;
                                updates.documentConfidence = data.documentConfidence;
                                logForDocument(currentDocId, "Loaded " + data.headerFields.length + " header fields and " + data.lineItems.length + " line items", false);
                            } else {
                                logForDocument(currentDocId, "No structured data found in response", true);
                            }

                            updateDocument(currentDocId, updates);
                        }

                        // New structured format
                        if (data.headerFields && data.lineItems) {
                            return {
                                headerFields: data.headerFields,
                                lineItems: data.lineItems,
                                documentConfidence: data.documentConfidence
                            };
                        }

                        return { headerFields: [], lineItems: [], documentConfidence: 0 };
                    })
                    .catch(error => {
                        logForDocument(currentDocId, "Failed to fetch document entities: " + error.message, true);
                        throw error;
                    });
            }

            // Build extraction results content
            function buildResultsContent() {
                oExtractionResultsContent.destroyItems();

                // Reset editedEntities and load from current document
                var currentDoc = getCurrentDocument();
                if (currentDoc) {
                    editedEntities = currentDoc.editedEntities || {};
                } else {
                    editedEntities = {};
                }

                // Use document confidence from current document
                var docConfidence = documentEntities.documentConfidence || 0;
                var docConfidenceText = Math.round(docConfidence * 100) + "%";
                var docConfidenceState = getConfidenceState(docConfidence);

                var oDocConfidenceStatus = new ObjectStatus({
                    text: "Document Confidence: " + docConfidenceText,
                    state: docConfidenceState
                });

                oExtractionResultsContent.addItem(oDocConfidenceStatus);
                oExtractionResultsContent.addItem(new Text({ text: "" }).addStyleClass("sapUiSmallMarginTop"));

                var headerFields = documentEntities.headerFields || [];
                var lineItems = documentEntities.lineItems || [];

                // Render header fields in a panel
                if (headerFields.length > 0) {
                    var oHeaderPanel = new Panel({
                        headerText: "Header Information (" + headerFields.length + " fields)",
                        expandable: true,
                        expanded: true,
                        content: new VBox({ items: [] })
                    }).addStyleClass("sapUiSmallMarginTop");

                    var oHeaderContent = oHeaderPanel.getContent()[0];

                    headerFields.forEach(function(entity) {
                        var fieldDef = schemaFields[entity.name] || {};
                        var fieldLabel = entity.label || fieldDef.label || entity.name;
                        var dataType = entity.dataType || fieldDef.dataType;

                        var fieldValue = "";
                        if (dataType === "Number") {
                            fieldValue = entity.numberValue !== null && entity.numberValue !== undefined ? String(entity.numberValue) : "";
                        } else if (dataType === "Date") {
                            fieldValue = entity.dateValue || "";
                        } else {
                            fieldValue = entity.stringValue || "";
                        }

                        var oFieldInput = new Input({
                            value: fieldValue,
                            width: "100%",
                            change: (function(ent, origVal) {
                                return function(oEvent) {
                                    var newValue = oEvent.getParameter("value");
                                    editedEntities[ent.ID] = {
                                        entity: ent,
                                        originalValue: origVal,
                                        editedValue: newValue,
                                        modified: newValue !== origVal
                                    };
                                    // Save to document
                                    var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                                    if (currentDocId) {
                                        updateDocument(currentDocId, { editedEntities: editedEntities });
                                    }
                                };
                            })(entity, fieldValue)
                        });

                        var confidence = entity.confidence || 0;
                        var confidenceText = Math.round(confidence * 100) + "%";
                        var confidenceState = getConfidenceState(confidence);

                        var oConfidenceStatus = new ObjectStatus({
                            text: confidenceText,
                            state: confidenceState,
                            width: "80px"
                        });

                        var oFieldRow = new HBox({
                            width: "100%",
                            alignItems: "Center",
                            items: [
                                new Label({
                                    text: fieldLabel,
                                    width: "200px"
                                }).addStyleClass("sapUiSmallMarginEnd"),
                                oFieldInput.setLayoutData(new FlexItemData({ growFactor: 1 })).addStyleClass("sapUiSmallMarginEnd"),
                                oConfidenceStatus
                            ]
                        }).addStyleClass("sapUiTinyMarginTop");

                        oHeaderContent.addItem(oFieldRow);
                    });

                    oExtractionResultsContent.addItem(oHeaderPanel);
                }

                // Render line items as a table
                if (lineItems.length > 0) {
                    var oLineItemsPanel = new Panel({
                        headerText: "Line Items (" + lineItems.length + " rows)",
                        expandable: true,
                        expanded: true,
                        content: new VBox({ items: [] })
                    }).addStyleClass("sapUiSmallMarginTop");

                    var oLineItemsContent = oLineItemsPanel.getContent()[0];

                    // Create table header
                    var oHeaderRow = new HBox({
                        width: "100%",
                        items: [
                            new Label({ text: "#", width: "40px" }).addStyleClass("sapUiSmallMarginEnd"),
                            new Label({ text: "Description", width: "300px" }).addStyleClass("sapUiSmallMarginEnd"),
                            new Label({ text: "Qty", width: "80px" }).addStyleClass("sapUiSmallMarginEnd"),
                            new Label({ text: "Unit Price", width: "120px" }).addStyleClass("sapUiSmallMarginEnd"),
                            new Label({ text: "Net Amount", width: "120px" }).addStyleClass("sapUiSmallMarginEnd"),
                            new Label({ text: "Confidence", width: "80px" })
                        ]
                    }).addStyleClass("sapUiSmallMarginTop");

                    oLineItemsContent.addItem(oHeaderRow);

                    // Create table rows
                    lineItems.forEach(function(lineItem) {
                        var occurrence = lineItem.occurrence;
                        var fields = lineItem.fields || [];

                        // Build field map by name
                        var fieldMap = {};
                        fields.forEach(function(f) {
                            fieldMap[f.name] = f;
                        });

                        var columnNames = ["description", "quantity", "unitPrice", "netAmount"];
                        var cells = [
                            new Text({ text: occurrence, width: "40px" })
                        ];

                        var avgConfidence = 0;
                        var confidenceCount = 0;

                        columnNames.forEach(function(colName) {
                            var entity = fieldMap[colName];
                            var width = colName === "description" ? "300px" : (colName === "quantity" ? "80px" : "120px");

                            if (entity) {
                                var dataType = entity.dataType;

                                var fieldValue = "";
                                if (dataType === "Number") {
                                    fieldValue = entity.numberValue !== null && entity.numberValue !== undefined ? String(entity.numberValue) : "";
                                } else if (dataType === "Date") {
                                    fieldValue = entity.dateValue || "";
                                } else {
                                    fieldValue = entity.stringValue || "";
                                }

                                var oFieldInput = new Input({
                                    value: fieldValue,
                                    width: width,
                                    change: (function(e, origVal) {
                                        return function(oEvent) {
                                            var newValue = oEvent.getParameter("value");
                                            editedEntities[e.ID] = {
                                                entity: e,
                                                originalValue: origVal,
                                                editedValue: newValue,
                                                modified: newValue !== origVal
                                            };
                                            // Save to document
                                            var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                                            if (currentDocId) {
                                                updateDocument(currentDocId, { editedEntities: editedEntities });
                                            }
                                        };
                                    })(entity, fieldValue)
                                });

                                cells.push(oFieldInput);

                                if (entity.confidence !== null && entity.confidence !== undefined) {
                                    avgConfidence += entity.confidence;
                                    confidenceCount++;
                                }
                            } else {
                                cells.push(new Input({ value: "", width: width, enabled: false }));
                            }
                        });

                        // Calculate average confidence for this line
                        var lineConfidence = confidenceCount > 0 ? avgConfidence / confidenceCount : 0;
                        var lineConfidenceText = Math.round(lineConfidence * 100) + "%";
                        var lineConfidenceState = getConfidenceState(lineConfidence);

                        cells.push(new ObjectStatus({
                            text: lineConfidenceText,
                            state: lineConfidenceState,
                            width: "80px"
                        }));

                        var oLineRow = new HBox({
                            width: "100%",
                            alignItems: "Center",
                            items: cells.map(function(cell, idx) {
                                return cell.addStyleClass(idx < cells.length - 1 ? "sapUiSmallMarginEnd" : "");
                            })
                        }).addStyleClass("sapUiTinyMarginTop");

                        oLineItemsContent.addItem(oLineRow);
                    });

                    oExtractionResultsContent.addItem(oLineItemsPanel);
                }
            }

            // Get extraction results
            function getResults() {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                var currentDoc = getCurrentDocument();

                if (!currentDocId || !currentDoc) {
                    MessageBox.warning("No document ID. Please upload a document first.");
                    return;
                }

                if (!currentDoc.schemaVersionId) {
                    MessageBox.warning("No schema version ID available.");
                    return;
                }

                logForDocument(currentDocId, "Fetching extraction results...", false);

                oExtractionResultsPanel.setVisible(false);
                oPdfViewerPanel.setVisible(false);

                fetchSchemaFields(currentDoc.schemaVersionId)
                    .then(function() {
                        return fetchDocumentEntities(currentDoc.documentId);
                    })
                    .then(function(results) {
                        documentEntities = results;

                        if (!results || (!results.headerFields || results.headerFields.length === 0) && (!results.lineItems || results.lineItems.length === 0)) {
                            MessageBox.information("No extraction results found for this document.");
                            return;
                        }

                        buildResultsContent();
                        oExtractionResultsPanel.setVisible(true);

                        // Display PDF if available from current document
                        var doc = getCurrentDocument();
                        if (doc && doc.pdfData) {
                            logForDocument(currentDocId, "Displaying PDF in viewer...", false);
                            displayPdf(doc.pdfData);
                        } else {
                            logForDocument(currentDocId, "No PDF data available to display", false);
                        }

                        logForDocument(currentDocId, "Extraction results displayed successfully", false);
                        MessageToast.show("Extraction results loaded");
                    })
                    .catch(function(error) {
                        logForDocument(currentDocId, "Failed to get results: " + error.message, true);
                        MessageBox.error("Failed to get results: " + error.message);
                    });
            }

            // Display PDF in viewer
            function displayPdf(base64Data) {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");

                if (!base64Data) {
                    // Try to get from current document
                    var currentDoc = getCurrentDocument();
                    if (currentDoc && currentDoc.pdfData) {
                        base64Data = currentDoc.pdfData;
                    } else {
                        logForDocument(currentDocId, "No PDF data available", true);
                        return;
                    }
                }

                // Make panel visible first to ensure iframe is rendered
                oPdfViewerPanel.setVisible(true);

                // Use setTimeout to ensure iframe is in DOM and ready
                setTimeout(function() {
                    var pdfViewer = document.getElementById("pdfViewer");
                    if (pdfViewer) {
                        try {
                            pdfViewer.src = "data:application/pdf;base64," + base64Data;
                            logForDocument(currentDocId, "PDF loaded in viewer", false);
                        } catch (error) {
                            logForDocument(currentDocId, "Failed to load PDF: " + error.message, true);
                        }
                    } else {
                        logForDocument(currentDocId, "PDF viewer iframe not found in DOM", true);
                    }
                }, 100);
            }

            // Confirm document
            function confirmDocument() {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                var currentDoc = getCurrentDocument();

                if (!currentDocId || !currentDoc || !currentDoc.documentId) {
                    MessageBox.warning("No document ID available.");
                    return;
                }

                logForDocument(currentDocId, "Starting confirmation workflow...", false);

                // Get edited entities from current document
                var docEditedEntities = currentDoc.editedEntities || {};
                var modifiedEntityIds = Object.keys(docEditedEntities).filter(id => docEditedEntities[id].modified);

                // Prepare entities array for the action
                var entitiesPayload = modifiedEntityIds.map(entityId => {
                    var editInfo = docEditedEntities[entityId];
                    var entity = editInfo.entity;

                    var entityUpdate = {
                        entityId: entity.ID,
                        stringValue: null,
                        numberValue: null,
                        dateValue: null
                    };

                    // Set the appropriate value field based on dataType
                    if (entity.dataType === "Number") {
                        entityUpdate.numberValue = parseFloat(editInfo.editedValue) || 0;
                    } else if (entity.dataType === "Date") {
                        entityUpdate.dateValue = editInfo.editedValue;
                    } else {
                        entityUpdate.stringValue = editInfo.editedValue;
                    }

                    return entityUpdate;
                });

                if (entitiesPayload.length > 0) {
                    logForDocument(currentDocId, "Updating " + entitiesPayload.length + " edited entities and confirming...", false);
                } else {
                    logForDocument(currentDocId, "No edited entities, confirming document...", false);
                }

                // Call the new CAP action that updates and confirms in one go
                fetch("./odata/invoice/updateAndConfirmDocument", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        documentId: currentDoc.documentId,
                        entities: entitiesPayload,
                        useForInstantLearning: false
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error?.message || "Update and confirmation failed (HTTP " + response.status + ")");
                        });
                    }
                    return response.json();
                })
                .then(result => {
                    logForDocument(currentDocId, "Document updated and confirmed successfully!", false);
                    logForDocument(currentDocId, JSON.stringify(result), false);
                    MessageBox.success("Document updated and confirmed successfully!");

                    // Update status display
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Confirmed");

                    // Update document status
                    updateDocument(currentDocId, { status: "confirmed" });

                    // Enable post to S/4 button
                    updateButtonStates();
                })
                .catch(error => {
                    logForDocument(currentDocId, "Confirmation failed: " + error.message, true);
                    MessageBox.error("Confirmation failed: " + error.message);
                });
            }

            // Post invoice to S/4HANA
            function postInvoiceToS4() {
                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                var currentDoc = getCurrentDocument();

                if (!currentDocId || !currentDoc) {
                    MessageBox.warning("No document selected.");
                    return;
                }

                if (!currentDoc.headerFields || currentDoc.headerFields.length === 0) {
                    MessageBox.warning("No invoice data available. Please get results first.");
                    return;
                }

                logForDocument(currentDocId, "Preparing to post invoice to S/4HANA...", false);

                // Build field map from extracted data
                var fieldMap = {};
                currentDoc.headerFields.forEach(function(field) {
                    var fieldName = field.name ? field.name.toLowerCase() : '';
                    var value;
                    if (field.dataType === "Number") {
                        value = field.numberValue;
                    } else if (field.dataType === "Date") {
                        value = field.dateValue;
                    } else {
                        value = field.stringValue;
                    }

                    // Store by original name and lowercase for easier lookup
                    fieldMap[field.name] = value;
                    if (fieldName) {
                        fieldMap[fieldName] = value;
                    }
                });

                // Helper function to get field value with multiple possible names
                function getFieldValue(possibleNames) {
                    for (var i = 0; i < possibleNames.length; i++) {
                        var name = possibleNames[i];
                        if (fieldMap[name] !== undefined && fieldMap[name] !== null && fieldMap[name] !== "") {
                            return fieldMap[name];
                        }
                    }
                    return "";
                }

                // Extract specific fields with common variations
                var invoiceDate = getFieldValue(['invoiceDate', 'invoicedate', 'documentDate', 'documentdate', 'date']);
                var invoiceNumber = getFieldValue(['invoiceNumber', 'invoicenumber', 'documentNumber', 'documentnumber', 'invoiceId', 'invoiceid', 'number']);
                var supplierTaxID = getFieldValue(['supplierTaxID', 'suppliertaxid', 'taxID', 'taxid', 'taxNumber', 'taxnumber', 'vendorTaxID', 'vendortaxid']);
                var supplier = getFieldValue(['supplier', 'vendor', 'vendorCode', 'vendorcode', 'supplierName', 'suppliername']);
                var currency = getFieldValue(['currency', 'currencyCode', 'currencycode']);
                var totalAmount = getFieldValue(['totalAmount', 'totalamount', 'grossAmount', 'grossamount', 'total', 'amount']);

                // Open dialog to collect S/4 posting data
                var oPostDialog = new sap.m.Dialog({
                    title: "Post Invoice to S/4HANA",
                    contentWidth: "600px",
                    content: new sap.m.VBox({
                        items: [
                            new sap.m.Label({ text: "Invoice Date (YYYY-MM-DD)", required: true }),
                            new sap.m.Input({ id: "s4InvoiceDate", value: invoiceDate }),

                            new sap.m.Label({ text: "Invoice Number", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4InvoiceNumber", value: invoiceNumber }),

                            new sap.m.Label({ text: "Supplier Tax ID", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4SupplierTaxID", value: supplierTaxID }),

                            new sap.m.Label({ text: "Company Code", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4CompanyCode", value: "1010" }),

                            new sap.m.Label({ text: "Supplier (Vendor Code)", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4Supplier", value: supplier }),

                            new sap.m.Label({ text: "Posting Date (YYYY-MM-DD)", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4PostingDate", value: new Date().toISOString().split('T')[0] }),

                            new sap.m.Label({ text: "Currency", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4Currency", value: currency || "USD" }),

                            new sap.m.Label({ text: "Gross Amount", required: true }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4GrossAmount", value: totalAmount }),

                            new sap.m.Label({ text: "Payment Terms" }).addStyleClass("sapUiSmallMarginTop"),
                            new sap.m.Input({ id: "s4PaymentTerms", value: "0001" }),

                            new sap.m.Text({
                                text: "Line items will be created from extracted data."
                            }).addStyleClass("sapUiSmallMarginTop")
                        ]
                    }).addStyleClass("sapUiSmallMargin"),
                    beginButton: new sap.m.Button({
                        text: "Post to S/4HANA",
                        type: "Emphasized",
                        press: function() {
                            var invoiceDate = sap.ui.getCore().byId("s4InvoiceDate").getValue();
                            var invoiceNumber = sap.ui.getCore().byId("s4InvoiceNumber").getValue();
                            var supplierTaxID = sap.ui.getCore().byId("s4SupplierTaxID").getValue();
                            var companyCode = sap.ui.getCore().byId("s4CompanyCode").getValue();
                            var supplier = sap.ui.getCore().byId("s4Supplier").getValue();
                            var postingDate = sap.ui.getCore().byId("s4PostingDate").getValue();
                            var currency = sap.ui.getCore().byId("s4Currency").getValue();
                            var grossAmount = parseFloat(sap.ui.getCore().byId("s4GrossAmount").getValue());
                            var paymentTerms = sap.ui.getCore().byId("s4PaymentTerms").getValue();

                            if (!invoiceDate || !invoiceNumber || !supplierTaxID || !companyCode || !supplier || !postingDate || !currency || !grossAmount) {
                                MessageBox.error("Please fill all required fields.");
                                return;
                            }

                            oPostDialog.close();

                            // Convert dates to OData format /Date(timestamp)/
                            var invoiceDateMs = new Date(invoiceDate).getTime();
                            var postingDateMs = new Date(postingDate).getTime();
                            var baselineDateMs = new Date(postingDate).getTime();

                            // Build line items from extracted data
                            var items = [];
                            if (currentDoc.lineItems && currentDoc.lineItems.length > 0) {
                                currentDoc.lineItems.forEach(function(lineItem, idx) {
                                    var lineFieldMap = {};
                                    lineItem.fields.forEach(function(field) {
                                        if (field.dataType === "Number") {
                                            lineFieldMap[field.name] = field.numberValue;
                                        } else {
                                            lineFieldMap[field.name] = field.stringValue;
                                        }
                                    });

                                    items.push({
                                        SupplierInvoiceItem: String((idx + 1) * 10).padStart(6, '0'),
                                        PurchaseOrder: lineFieldMap.poNumber || fieldMap.poNumber || "",
                                        PurchaseOrderItem: String((idx + 1) * 10).padStart(5, '0'),
                                        Plant: "1010",
                                        TaxCode: "I0",
                                        DocumentCurrency: currency,
                                        SupplierInvoiceItemAmount: lineFieldMap.netAmount || 0,
                                        QuantityInPurchaseOrderUnit: lineFieldMap.quantity || 1,
                                        PurchaseOrderQuantityUnit: lineFieldMap.unit || "EA",
                                        SupplierInvoiceItemText: lineFieldMap.description || ""
                                    });
                                });
                            } else {
                                // Fallback: create single item
                                items.push({
                                    SupplierInvoiceItem: "000010",
                                    PurchaseOrder: fieldMap.poNumber || "",
                                    PurchaseOrderItem: "00010",
                                    Plant: "1010",
                                    TaxCode: "I0",
                                    DocumentCurrency: currency,
                                    SupplierInvoiceItemAmount: grossAmount,
                                    QuantityInPurchaseOrderUnit: 1,
                                    PurchaseOrderQuantityUnit: "EA",
                                    SupplierInvoiceItemText: "Invoice " + invoiceNumber
                                });
                            }

                            logForDocument(currentDocId, "Posting invoice to S/4HANA...", false);

                            fetch("./odata/invoice/postSupplierInvoiceToS4", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    invoiceData: {
                                        CompanyCode: companyCode,
                                        DocumentDate: "/Date(" + invoiceDateMs + ")/",
                                        PostingDate: "/Date(" + postingDateMs + ")/",
                                        SupplierInvoiceIDByInvcgParty: invoiceNumber,
                                        InvoicingParty: supplier,
                                        DocumentCurrency: currency,
                                        InvoiceGrossAmount: grossAmount,
                                        DueCalculationBaseDate: "/Date(" + baselineDateMs + ")/",
                                        PaymentTerms: paymentTerms,
                                        items: items
                                    }
                                })
                            })
                            .then(response => {
                                if (!response.ok) {
                                    return response.json().then(err => {
                                        throw new Error(err.error?.message || "S/4 posting failed (HTTP " + response.status + ")");
                                    });
                                }
                                return response.json();
                            })
                            .then(result => {
                                logForDocument(currentDocId, "Invoice posted to S/4HANA successfully!", false);
                                logForDocument(currentDocId, "Supplier Invoice: " + result.SupplierInvoice + ", Fiscal Year: " + result.FiscalYear, false);

                                MessageBox.success("Invoice posted to S/4HANA!\n\nSupplier Invoice: " + result.SupplierInvoice + "\nFiscal Year: " + result.FiscalYear);

                                // Update document status
                                updateDocument(currentDocId, {
                                    status: "posted",
                                    s4InvoiceNumber: result.SupplierInvoice,
                                    s4FiscalYear: result.FiscalYear
                                });
                            })
                            .catch(error => {
                                logForDocument(currentDocId, "S/4 posting failed: " + error.message, true);
                                MessageBox.error("Failed to post invoice to S/4HANA: " + error.message);
                            });
                        }
                    }),
                    endButton: new sap.m.Button({
                        text: "Cancel",
                        press: function() {
                            oPostDialog.close();
                        }
                    }),
                    afterClose: function() {
                        oPostDialog.destroy();
                    }
                });

                oPostDialog.open();
            }

            // Update button states based on current document status
            function updateButtonStates() {
                var currentDoc = getCurrentDocument();

                if (!currentDoc) {
                    oGetResultsButton.setEnabled(false);
                    oCheckStatusButton.setEnabled(false);
                    oConfirmButton.setEnabled(false);
                    oPostToS4Button.setEnabled(false);
                    return;
                }

                var status = currentDoc.status;
                var documentId = currentDoc.documentId;

                oCheckStatusButton.setEnabled(!!documentId);

                var canGetResults = !!documentId &&
                                  (status === "reviewNeeded" ||
                                   status === "readyForPosting" ||
                                   status === "confirmed");
                oGetResultsButton.setEnabled(canGetResults);

                var canConfirm = !!documentId &&
                               (status === "reviewNeeded" ||
                                status === "readyForPosting");
                oConfirmButton.setEnabled(canConfirm);

                var canPostToS4 = status === "confirmed" || status === "posted";
                oPostToS4Button.setEnabled(canPostToS4);
            }

            // Start polling
            function startPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                }

                var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                if (currentDocId) {
                    logForDocument(currentDocId, "Starting automatic polling (every 5 seconds)...", false);
                }

                // Use multi-document polling if in list view, single document polling in detail view
                var view = oDocumentsModel.getProperty("/view");
                if (view === "list") {
                    pollingInterval = setInterval(pollAllProcessingDocuments, 5000);
                } else {
                    pollingInterval = setInterval(checkStatus, 5000);
                }
            }

            // Stop polling
            function stopPolling() {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;

                    var currentDocId = oDocumentsModel.getProperty("/currentDocumentId");
                    if (currentDocId) {
                        logForDocument(currentDocId, "Polling stopped", false);
                    }
                }
            }

            // Get Results button (must be declared before used)
            var oGetResultsButton = new Button({
                text: "Get Results",
                icon: "sap-icon://download",
                enabled: false,
                press: getResults
            });

            // Post to S4 button
            var oPostToS4Button = new Button({
                text: "Post to S/4HANA",
                icon: "sap-icon://simulate",
                type: "Emphasized",
                enabled: false,
                press: postInvoiceToS4
            });

            // Documents table for list view
            var oDocumentsTable = new Table({
                width: "100%",
                mode: "SingleSelectMaster",
                columns: [
                    new Column({
                        header: new Label({ text: "File Name" }),
                        width: "30%"
                    }),
                    new Column({
                        header: new Label({ text: "Status" }),
                        width: "15%"
                    }),
                    new Column({
                        header: new Label({ text: "Extraction Status" }),
                        width: "15%"
                    }),
                    new Column({
                        header: new Label({ text: "Uploaded At" }),
                        width: "20%"
                    }),
                    new Column({
                        header: new Label({ text: "Actions" }),
                        width: "20%"
                    })
                ],
                items: {
                    path: "documents>/documents",
                    template: new ColumnListItem({
                        type: "Active",
                        press: function(oEvent) {
                            var oItem = oEvent.getSource();
                            var oContext = oItem.getBindingContext("documents");
                            var docId = oContext.getProperty("id");
                            switchToDetailView(docId);
                        },
                        cells: [
                            new Text({ text: "{documents>fileName}" }),
                            new ObjectStatus({
                                text: "{documents>status}",
                                state: {
                                    path: "documents>status",
                                    formatter: function(status) {
                                        if (status === "confirmed" || status === "reviewNeeded") return "Success";
                                        if (status === "failed" || status === "ERROR" || status === "FAILED") return "Error";
                                        if (status === "pending" || status === "uploading") return "None";
                                        return "Information";
                                    }
                                }
                            }),
                            new Text({ text: "{documents>extractionStatus}" }),
                            new Text({
                                text: {
                                    path: "documents>uploadedAt",
                                    formatter: function(timestamp) {
                                        if (!timestamp) return "";
                                        return new Date(timestamp).toLocaleString();
                                    }
                                }
                            }),
                            new Button({
                                text: "View Details",
                                icon: "sap-icon://detail-view",
                                press: function(oEvent) {
                                    var oItem = oEvent.getSource().getParent();
                                    var oContext = oItem.getBindingContext("documents");
                                    var docId = oContext.getProperty("id");
                                    switchToDetailView(docId);
                                }
                            })
                        ]
                    })
                }
            }).setModel(oDocumentsModel, "documents");

            // Documents panel for list view
            var oDocumentsPanel = new Panel({
                headerText: "Documents",
                expandable: true,
                expanded: true,
                content: new VBox({
                    items: [
                        oDocumentsTable,
                        new HBox({
                            items: [
                                new Button({
                                    text: "Refresh All",
                                    icon: "sap-icon://refresh",
                                    press: pollAllProcessingDocuments
                                })
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Load data on init
            loadClients();
            loadSchemaVersions();

            // Configuration panel
            var oConfigPanel = new Panel({
                headerText: "DocAI Configuration",
                expandable: true,
                expanded: false,
                content: new VBox({
                    items: [
                        new Label({ text: "Client ID", required: true }),
                        new HBox({
                            items: [
                                oClientComboBox,
                                oRefreshClientsButton.addStyleClass("sapUiTinyMarginBegin")
                            ],
                            width: "100%"
                        }),
                        new Text({
                            text: "Select from list or enter custom client ID"
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Button({
                                    text: "Test Connection",
                                    icon: "sap-icon://validate",
                                    press: testConnection
                                })
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Upload panel
            var oUploadPanel = new Panel({
                headerText: "Document Upload",
                expandable: true,
                expanded: true,
                content: new VBox({
                    items: [
                        new Label({ text: "Schema Version", required: true }),
                        new HBox({
                            width: "100%",
                            items: [
                                oSchemaVersionSelect.setLayoutData(new FlexItemData({ growFactor: 1 })),
                                oRefreshSchemaVersionsButton.addStyleClass("sapUiTinyMarginBegin")
                            ]
                        }),
                        new Label({ text: "OCR Engine" }).addStyleClass("sapUiSmallMarginTop"),
                        oOcrEngineInput,
                        new Text({
                            text: "Allowed values: 'Document' or 'SceneText'"
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new Label({ text: "Select PDF File", required: true }).addStyleClass("sapUiSmallMarginTop"),
                        oFileUploader,
                        new HBox({
                            items: [
                                new Button({
                                    text: "Upload to DocAI",
                                    type: "Emphasized",
                                    icon: "sap-icon://upload",
                                    press: uploadDocument
                                })
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Status panel
            var oCheckStatusButton = new Button({
                text: "Check Status",
                icon: "sap-icon://refresh",
                enabled: false,
                press: checkStatus
            });

            var oStatusPanel = new Panel({
                headerText: "Processing Status",
                expandable: true,
                expanded: true,
                content: new VBox({
                    items: [
                        oProgress,
                        oDocumentIdText,
