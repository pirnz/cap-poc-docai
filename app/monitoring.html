<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Monitoring</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.10/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Text",
            "sap/m/Button",
            "sap/m/MessageToast",
            "sap/m/Label",
            "sap/m/ObjectStatus",
            "sap/ui/model/json/JSONModel",
            "sap/m/Table",
            "sap/m/Column",
            "sap/m/ColumnListItem",
            "sap/m/Link",
            "sap/m/BusyDialog"
        ], function (App, Page, VBox, HBox, Title, Text, Button, MessageToast, Label, ObjectStatus, JSONModel, Table, Column, ColumnListItem, Link, BusyDialog) {

            // Helper function: Get API base path based on hostname
            function getApiBasePath() {
                var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                return isLocalhost ? './' : './odata/';
            }

            // JSON model for documents
            var oDocumentsModel = new JSONModel({
                documents: []
            });

            // Loading dialog
            var oBusyDialog = new BusyDialog({
                text: "Loading documents..."
            });

            // Helper function: Generate UUID
            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0;
                    var v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // Load all documents from database
            function loadAllDocuments() {
                oBusyDialog.open();

                fetch(getApiBasePath() + "document/Documents", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    }
                })
                .then(response => response.json())
                .then(data => {
                    var dbDocuments = data.value || [];
                    var uiDocuments = [];

                    // Map database documents to UI format
                    dbDocuments.forEach(function(dbDoc) {
                        var newDoc = {
                            id: generateUUID(),
                            fileName: parseFileName(dbDoc.fileName, dbDoc.extractionSource),
                            documentId: dbDoc.docaiDocumentId,
                            schemaVersionId: dbDoc.schemaVersionId,
                            clientId: dbDoc.clientId,
                            status: dbDoc.status || "unknown",
                            extractionStatus: dbDoc.extractionStatus,
                            extractionSource: dbDoc.extractionSource,
                            uploadedAt: dbDoc.createdAt
                        };

                        uiDocuments.push(newDoc);
                    });

                    // Sort by uploadedAt descending (most recent first)
                    uiDocuments.sort(function(a, b) {
                        var dateA = a.uploadedAt ? new Date(a.uploadedAt) : new Date(0);
                        var dateB = b.uploadedAt ? new Date(b.uploadedAt) : new Date(0);
                        return dateB - dateA;
                    });

                    oDocumentsModel.setProperty("/documents", uiDocuments);
                    MessageToast.show("Loaded " + dbDocuments.length + " documents from database");
                    oBusyDialog.close();
                })
                .catch(error => {
                    MessageToast.show("Failed to load documents: " + error.message);
                    console.error("Failed to load documents:", error);
                    oBusyDialog.close();
                });
            }

            // Parse filename from callback documents
            function parseFileName(fileName, source) {
                if (!fileName) return "Unknown";

                // For callback documents, try to extract actual filename from pattern
                if (source === 'callback') {
                    // Pattern: callback_<timestamp>_<filename> or just the JSON payload name
                    // Extract anything after last underscore or slash
                    var match = fileName.match(/callback[_-].*?[_-](.+)$/i);
                    if (match) return match[1];

                    // Try to extract from path
                    var pathMatch = fileName.match(/[\/\\]([^\/\\]+)$/);
                    if (pathMatch) return pathMatch[1];
                }

                return fileName;
            }

            // Get extraction source display text with indicator
            function getExtractionSourceText(source) {
                if (source === 'api') return '📡 API';
                if (source === 'callback') return '📨 Callback';
                if (source === 'local') return '💾 Local';
                return source || '-';
            }

            // Get merged DocAI status (prioritize extractionStatus over status)
            function getDocAIStatus(doc) {
                var status = doc.extractionStatus || doc.status || 'unknown';

                // Normalize status labels
                if (status === 'SUCCEEDED' || status === 'DONE') return 'Confirmed';
                if (status === 'reviewNeeded') return 'Review Needed';
                if (status === 'confirmed') return 'Confirmed';
                if (status === 'FAILED' || status === 'failed') return 'Failed';
                if (status === 'ERROR') return 'Error';
                if (status === 'pending' || status === 'IN_PROGRESS') return 'In Process';
                if (status === 'uploading') return 'Uploading';

                return status;
            }

            // Get status display state
            function getStatusState(status) {
                if (status === "Confirmed" || status === "confirmed" || status === "DONE" || status === "SUCCEEDED") {
                    return "Success";
                }
                if (status === "Review Needed" || status === "reviewNeeded") {
                    return "Warning";
                }
                if (status === "Failed" || status === "failed" || status === "ERROR" || status === "FAILED") {
                    return "Error";
                }
                if (status === "In Process" || status === "pending" || status === "uploading" || status === "IN_PROGRESS") {
                    return "Information";
                }
                return "None";
            }

            // Format Document ID as DocAI link
            function getDocAILink(documentId) {
                if (!documentId) return null;
                return "https://docai-workshop.eu10.doc.cloud.sap/workspace#/Documents(" + documentId + ")";
            }

            // Documents table
            var oDocumentsTable = new Table({
                width: "100%",
                mode: "SingleSelectMaster",
                columns: [
                    new Column({
                        header: new Label({ text: "File Name" }),
                        width: "20%"
                    }),
                    new Column({
                        header: new Label({ text: "Document ID" }),
                        width: "20%"
                    }),
                    new Column({
                        header: new Label({ text: "DocAI Status" }),
                        width: "15%"
                    }),
                    new Column({
                        header: new Label({ text: "Extraction Source" }),
                        width: "15%"
                    }),
                    new Column({
                        header: new Label({ text: "Uploaded At" }),
                        width: "20%"
                    }),
                    new Column({
                        header: new Label({ text: "Actions" }),
                        width: "10%"
                    })
                ],
                items: {
                    path: "documents>/documents",
                    template: new ColumnListItem({
                        type: "Active",
                        press: function(oEvent) {
                            var oItem = oEvent.getSource();
                            var oContext = oItem.getBindingContext("documents");
                            var docId = oContext.getProperty("documentId");
                            if (docId) {
                                window.location.href = './validation.html?docId=' + docId;
                            } else {
                                MessageToast.show("No document ID available");
                            }
                        },
                        cells: [
                            new Text({ text: "{documents>fileName}" }),
                            new Link({
                                text: "{documents>documentId}",
                                href: {
                                    path: "documents>documentId",
                                    formatter: getDocAILink
                                },
                                target: "_blank",
                                visible: {
                                    path: "documents>documentId",
                                    formatter: function(docId) {
                                        return !!docId;
                                    }
                                }
                            }),
                            new ObjectStatus({
                                text: {
                                    parts: [
                                        { path: "documents>extractionStatus" },
                                        { path: "documents>status" }
                                    ],
                                    formatter: function(extractionStatus, status) {
                                        return getDocAIStatus({
                                            extractionStatus: extractionStatus,
                                            status: status
                                        });
                                    }
                                },
                                state: {
                                    parts: [
                                        { path: "documents>extractionStatus" },
                                        { path: "documents>status" }
                                    ],
                                    formatter: function(extractionStatus, status) {
                                        var docStatus = getDocAIStatus({
                                            extractionStatus: extractionStatus,
                                            status: status
                                        });
                                        return getStatusState(docStatus);
                                    }
                                }
                            }),
                            new Text({
                                text: {
                                    path: "documents>extractionSource",
                                    formatter: getExtractionSourceText
                                }
                            }),
                            new Text({
                                text: {
                                    path: "documents>uploadedAt",
                                    formatter: function(timestamp) {
                                        if (!timestamp) return "";
                                        return new Date(timestamp).toLocaleString();
                                    }
                                }
                            }),
                            new Button({
                                text: "View Details",
                                icon: "sap-icon://detail-view",
                                type: "Transparent",
                                press: function(oEvent) {
                                    oEvent.cancelBubble();
                                    var oItem = oEvent.getSource().getParent();
                                    var oContext = oItem.getBindingContext("documents");
                                    var docId = oContext.getProperty("documentId");
                                    if (docId) {
                                        window.location.href = './validation.html?docId=' + docId;
                                    } else {
                                        MessageToast.show("No document ID available");
                                    }
                                }
                            })
                        ]
                    })
                }
            }).setModel(oDocumentsModel, "documents");

            // Refresh button
            var oRefreshButton = new Button({
                text: "Refresh All",
                icon: "sap-icon://refresh",
                type: "Emphasized",
                press: loadAllDocuments
            });

            // Back button
            var oBackButton = new Button({
                text: "Back to Home",
                icon: "sap-icon://home",
                press: function() {
                    window.location.href = "./index.html";
                }
            });

            // Header section
            var oHeader = new VBox({
                width: "100%",
                items: [
                    new HBox({
                        width: "100%",
                        justifyContent: "SpaceBetween",
                        alignItems: "Center",
                        items: [
                            new VBox({
                                items: [
                                    new Title({
                                        text: "Document Monitoring",
                                        level: "H2"
                                    }),
                                    new Text({
                                        text: "Monitor all documents processed by DocAI"
                                    }).addStyleClass("sapUiTinyMarginTop")
                                ]
                            }),
                            new HBox({
                                items: [
                                    oRefreshButton,
                                    oBackButton.addStyleClass("sapUiTinyMarginBegin")
                                ]
                            })
                        ]
                    }).addStyleClass("sapUiMediumMarginTop sapUiSmallMarginBottom")
                ]
            });

            // Documents section
            var oDocumentsSection = new VBox({
                width: "100%",
                items: [
                    new Text({
                        text: "Click on a row to view document details in validation page"
                    }).addStyleClass("sapUiSmallMarginBottom"),
                    oDocumentsTable
                ]
            });

            // Main content
            var oMainContent = new VBox({
                width: "95%",
                items: [
                    oHeader,
                    oDocumentsSection
                ],
                alignItems: "Start"
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                title: "Document Monitoring",
                showHeader: true,
                showNavButton: true,
                navButtonPress: function() {
                    window.location.href = "./index.html";
                },
                content: [
                    new VBox({
                        width: "100%",
                        items: [oMainContent],
                        alignItems: "Center"
                    })
                ]
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");

            // Auto-load documents on init
            loadAllDocuments();
        }, function(err) {
            console.error("UI5 module loading failed:", err);
            document.body.innerHTML = '<div style="padding:20px;color:red;">Error loading UI5 framework. Please check console and refresh.</div>';
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>
</html>
