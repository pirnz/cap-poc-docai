<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAI Workbench</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.10/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Text",
            "sap/m/Link",
            "sap/m/GenericTile",
            "sap/m/TileContent",
            "sap/m/ImageContent",
            "sap/ui/core/Icon",
            "sap/m/Panel",
            "sap/m/MessageToast",
            "sap/m/FlexItemData"
        ], function (App, Page, VBox, HBox, Title, Text, Link, GenericTile, TileContent, ImageContent, Icon, Panel, MessageToast, FlexItemData) {

            // Check if all modules loaded
            if (!App || !Page || !VBox || !HBox) {
                console.error("Failed to load required UI5 modules");
                document.body.innerHTML = '<div style="padding:20px;color:red;">Error: Failed to load UI5 libraries. Please refresh the page.</div>';
                return;
            }

            // Navigation function
            function navigateTo(path) {
                window.location.href = path;
            }

            // Main dashboard tiles
            var oIngestionTile = new GenericTile({
                header: "Ingestion",
                subheader: "Upload documents and emails",
                press: function() {
                    navigateTo("./ingestion.html");
                },
                tileContent: new TileContent({
                    content: new Icon({
                        src: "sap-icon://upload",
                        size: "4rem",
                        color: "#0a6ed1"
                    })
                })
            }).addStyleClass("sapUiTinyMarginEnd");

            var oMonitoringTile = new GenericTile({
                header: "Monitoring",
                subheader: "View document processing status",
                press: function() {
                    navigateTo("./monitoring.html");
                },
                tileContent: new TileContent({
                    content: new Icon({
                        src: "sap-icon://monitor-payments",
                        size: "4rem",
                        color: "#0a6ed1"
                    })
                })
            });

            // System information panel
            var oSystemInfoPanel = new Panel({
                headerText: "System Information",
                expandable: true,
                expanded: false,
                content: new VBox({
                    items: [
                        new Title({
                            text: "Service Endpoints",
                            level: "H4"
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Text({
                                    text: "OData Service:",
                                    width: "150px"
                                }).addStyleClass("sapUiSmallMarginEnd"),
                                new Text({
                                    text: "/odata/document",
                                    wrapping: true
                                })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Text({
                                    text: "Webhook Endpoint:",
                                    width: "150px"
                                }).addStyleClass("sapUiSmallMarginEnd"),
                                new Text({
                                    text: "/webhook/docai",
                                    wrapping: true
                                })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),
                        new HBox({
                            items: [
                                new Text({
                                    text: "Enriching Endpoint:",
                                    width: "150px"
                                }).addStyleClass("sapUiSmallMarginEnd"),
                                new Text({
                                    text: "/odata/v4/callback-enrich",
                                    wrapping: true
                                })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop"),

                        new Title({
                            text: "Key Actions",
                            level: "H4"
                        }).addStyleClass("sapUiSmallMarginTop"),
                        new VBox({
                            items: [
                                new Text({ text: "• uploadDocument - Upload PDF to DocAI" }),
                                new Text({ text: "• confirmDocument - Confirm extraction results" }),
                                new Text({ text: "• getExtractionResults - Retrieve parsed data" }),
                                new Text({ text: "• submitToDocAI - Submit document for processing" }),
                                new Text({ text: "• getDocAIStatus - Check processing status" }),
                                new Text({ text: "• getDocAIResults - Get full results with PDF" }),
                                new Text({ text: "• updateAndConfirmDocument - Update and confirm in one call" }),
                                new Text({ text: "• postSupplierInvoiceToS4 - Post invoice to S/4HANA" }),
                                new Text({ text: "• testDocAI - Test API connectivity" }),
                                new Text({ text: "• getSchemaClients - List available clients" }),
                                new Text({ text: "• getSchemaVersionsList - List schema versions" }),
                                new Text({ text: "• getSchemaFields - Get schema field definitions" }),
                                new Text({ text: "• createBatch - Create processing batch" }),
                                new Text({ text: "• processBatch - Process batch documents" }),
                                new Text({ text: "• pollBatchStatus - Monitor batch processing" })
                            ]
                        }).addStyleClass("sapUiTinyMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiMediumMarginTop");

            // Footer
            var oFooter = new VBox({
                items: [
                    new Text({
                        text: "DocAI Workbench v1.0.0 | Built with SAP CAP and SAP Document Information Extraction v4",
                        textAlign: "Center"
                    }).addStyleClass("sapUiTinyMarginTop"),
                    new HBox({
                        justifyContent: "Center",
                        items: [
                            new Link({
                                text: "Documentation",
                                href: "https://help.sap.com/docs/document-ai?locale=en-US",
                                target: "_blank"
                            }).addStyleClass("sapUiTinyMarginEnd"),
                            new Text({ text: "•" }).addStyleClass("sapUiTinyMarginEnd sapUiTinyMarginBegin"),
                            new Link({
                                text: "API Reference",
                                href: "https://api.sap.com/api/document_information_extraction_api_v2/overview",
                                target: "_blank"
                            }).addStyleClass("sapUiTinyMarginEnd sapUiTinyMarginBegin"),
                            new Text({ text: "•" }).addStyleClass("sapUiTinyMarginEnd sapUiTinyMarginBegin"),
                            new Link({
                                text: "Support",
                                href: "https://discovery-center.cloud.sap/protected/index.html#/serviceCatalog/sap-document-ai?tab=featuretab&region=all",
                                target: "_blank"
                            }).addStyleClass("sapUiTinyMarginBegin")
                        ]
                    }).addStyleClass("sapUiTinyMarginTop")
                ]
            }).addStyleClass("sapUiLargeMarginTop");

            // Main content
            var oMainContent = new VBox({
                width: "100%",
                alignItems: "Center",
                items: [
                    // Header
                    new VBox({
                        alignItems: "Center",
                        items: [
                            new Title({
                                text: "DocAI Workbench",
                                level: "H1"
                            }).addStyleClass("sapUiLargeMarginTop"),
                            new Text({
                                text: "Process documents with SAP Document Information Extraction",
                                textAlign: "Center"
                            }).addStyleClass("sapUiTinyMarginTop")
                        ]
                    }),

                    // Tiles container
                    new HBox({
                        width: "100%",
                        justifyContent: "Center",
                        alignItems: "Stretch",
                        items: [
                            oIngestionTile.setLayoutData(new FlexItemData({
                                minWidth: "300px",
                                maxWidth: "400px"
                            })),
                            oMonitoringTile.setLayoutData(new FlexItemData({
                                minWidth: "300px",
                                maxWidth: "400px"
                            }))
                        ]
                    }).addStyleClass("sapUiLargeMarginTop"),

                    // System information
                    new VBox({
                        width: "95%",
                        items: [oSystemInfoPanel]
                    }),

                    // Footer
                    oFooter
                ]
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                title: "DocAI Workbench",
                showHeader: false,
                content: [oMainContent]
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");
        }, function(err) {
            console.error("UI5 module loading failed:", err);
            document.body.innerHTML = '<div style="padding:20px;color:red;">Error loading UI5 framework. Please check console and refresh.</div>';
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>
</html>
