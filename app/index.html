<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Processing with DocAI</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Text",
            "sap/m/GenericTile",
            "sap/m/TileContent",
            "sap/m/Link",
            "sap/m/FlexBox",
            "sap/ui/core/Icon"
        ], function (App, Page, VBox, HBox, Title, Text, GenericTile, TileContent, Link, FlexBox, Icon) {

            // Create tiles for each app
            var oDocAIWorkbenchTile = new GenericTile({
                header: "DocAI Workbench",
                subheader: "Main Application",
                press: function() {
                    window.location.href = "/docai-test.html";
                },
                tileContent: new TileContent({
                    content: new VBox({
                        items: [
                            new Icon({
                                src: "sap-icon://business-card",
                                size: "3rem",
                                color: "#0070f2"
                            }).addStyleClass("sapUiTinyMarginBottom"),
                            new Text({
                                text: "Multi-document processing with SAP Document Information Extraction API v4. Upload, process, and validate invoices."
                            }).addStyleClass("sapUiTinyMarginTop")
                        ],
                        alignItems: "Center"
                    })
                })
            }).addStyleClass("sapUiMediumMargin");

            var oUploadDemoTile = new GenericTile({
                header: "Upload Demo",
                subheader: "Batch File Upload",
                press: function() {
                    window.location.href = "/upload-demo.html";
                },
                tileContent: new TileContent({
                    content: new VBox({
                        items: [
                            new Icon({
                                src: "sap-icon://upload",
                                size: "3rem",
                                color: "#0070f2"
                            }).addStyleClass("sapUiTinyMarginBottom"),
                            new Text({
                                text: "Demonstration of file upload capabilities: .eml, .zip, PDF files with batch processing."
                            }).addStyleClass("sapUiTinyMarginTop")
                        ],
                        alignItems: "Center"
                    })
                })
            }).addStyleClass("sapUiMediumMargin");

            // Features list
            var aFeatures = [
                "Multi-document Processing",
                "DocAI v4 Integration",
                "Real-time Status Tracking",
                "Confidence Scoring",
                "Field Validation & Editing",
                "S/4HANA Integration",
                "PDF Viewer"
            ];

            var oFeatureBox = new FlexBox({
                wrap: "Wrap",
                items: aFeatures.map(function(feature) {
                    return new Text({
                        text: "✅ " + feature
                    }).addStyleClass("sapUiTinyMarginEnd sapUiTinyMarginBottom");
                })
            }).addStyleClass("sapUiSmallMarginTop");

            // API Links
            var oApiBox = new VBox({
                items: [
                    new Title({ text: "API Endpoints", level: "H3" }).addStyleClass("sapUiSmallMarginTop"),
                    new Link({ text: "Main OData Service", href: "/invoice/", target: "_blank" }),
                    new Link({ text: "Service Metadata", href: "/invoice/$metadata", target: "_blank" }),
                    new Link({ text: "DocAI Webhook", href: "/webhook/", target: "_blank" })
                ]
            }).addStyleClass("sapUiMediumMarginTop");

            // Testing section
            var oTestBox = new VBox({
                items: [
                    new Title({ text: "Development", level: "H3" }).addStyleClass("sapUiSmallMarginTop"),
                    new Text({ text: "Test webhook: node test/test-callback.js" }),
                    new Text({ text: "Test DocAI v4: node test/test-docai-v4.js" }),
                    new Text({ text: "Verify data: node test/verify-data.js" })
                ]
            }).addStyleClass("sapUiMediumMarginTop");

            // Status badge
            var oStatusBox = new HBox({
                items: [
                    new Title({ text: "Invoice Processing with DocAI", level: "H2" }),
                    new Text({ text: "Ready" })
                        .addStyleClass("sapUiTinyMarginBegin")
                        .addStyleClass("sapUiPositiveText")
                ],
                alignItems: "Center"
            });

            var oSubtitle = new Text({
                text: "Process invoice PDFs with SAP Document Information Extraction"
            }).addStyleClass("sapUiTinyMarginTop sapUiTinyMarginBottom");

            // Tiles container
            var oTilesBox = new FlexBox({
                wrap: "Wrap",
                justifyContent: "Center",
                items: [oDocAIWorkbenchTile, oUploadDemoTile]
            }).addStyleClass("sapUiMediumMarginTop sapUiMediumMarginBottom");

            // Main content
            var oMainContent = new VBox({
                width: "100%",
                alignItems: "Center",
                items: [
                    new VBox({
                        width: "90%",
                        alignItems: "Center",
                        items: [
                            oStatusBox,
                            oSubtitle,
                            oTilesBox,
                            new VBox({
                                width: "100%",
                                items: [
                                    new Title({ text: "Features", level: "H3" }).addStyleClass("sapUiMediumMarginTop"),
                                    oFeatureBox,
                                    oApiBox,
                                    oTestBox
                                ]
                            })
                        ]
                    })
                ]
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                showHeader: false,
                content: [oMainContent],
                backgroundDesign: "Solid"
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody">
    <div id="content"></div>
</body>
</html>
