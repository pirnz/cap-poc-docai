<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Validation - DocAI</title>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.10/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.unified"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-xx-waitForTheme="true"
    ></script>
    <script>
        sap.ui.require([
            "sap/m/App",
            "sap/m/Page",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Title",
            "sap/m/Label",
            "sap/m/Text",
            "sap/m/Input",
            "sap/m/TextArea",
            "sap/m/Button",
            "sap/m/MessageToast",
            "sap/m/MessageBox",
            "sap/m/ProgressIndicator",
            "sap/m/Panel",
            "sap/ui/core/Icon",
            "sap/m/ObjectStatus",
            "sap/ui/model/json/JSONModel",
            "sap/ui/core/HTML",
            "sap/m/FlexItemData",
            "sap/m/BusyDialog",
            "sap/m/Link"
        ], function (App, Page, VBox, HBox, Title, Label, Text, Input, TextArea, Button, MessageToast, MessageBox, ProgressIndicator, Panel, Icon, ObjectStatus, JSONModel, HTML, FlexItemData, BusyDialog, Link) {

            // State variables
            var currentDocumentId = null;
            var currentSchemaVersionId = null;
            var currentDocumentStatus = null;
            var schemaFields = {};
            var documentEntities = { headerFields: [], lineItems: [], documentConfidence: 0, parentEntities: {} };
            var editedEntities = {};
            var pdfData = null;
            var extractionSource = null;
            var currentFileName = null;
            var currentMimeType = null;

            // Helper function: Get API base path based on hostname
            function getApiBasePath() {
                var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                return isLocalhost ? './' : './odata/';
            }

            // Parse URL parameters
            function getUrlParameter(name) {
                var urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            // Get document ID from URL
            var urlDocId = getUrlParameter('docId') || getUrlParameter('docaiDocumentId');

            // Progress indicator
            var oProgress = new ProgressIndicator({
                visible: false,
                percentValue: 0,
                displayValue: "Idle",
                width: "100%",
                state: "None"
            });

            // Response display for logs
            var oResponseArea = new TextArea({
                width: "100%",
                rows: 15,
                editable: false,
                placeholder: "Document logs will appear here..."
            });

            // Status checking busy dialog
            var oBusyDialog = new BusyDialog({
                text: "Checking status...",
                title: "Loading"
            });

            // Document ID display as link
            var oDocumentIdLink = new Link({
                text: "",
                href: "",
                target: "_blank"
            }).addStyleClass("sapUiSmallMarginTop");

            // Extraction source indicator
            var oExtractionSourceText = new Text({
                text: ""
            }).addStyleClass("sapUiSmallMarginTop");

            // Log function
            function log(message, isError) {
                var timestamp = new Date().toLocaleTimeString();
                var prefix = isError ? "❌ ERROR" : "✅";
                var line = `[${timestamp}] ${prefix} ${message}\n`;
                oResponseArea.setValue(oResponseArea.getValue() + line);
            }

            function logJson(label, data) {
                var timestamp = new Date().toLocaleTimeString();
                var line = `[${timestamp}] 📋 ${label}:\n${JSON.stringify(data, null, 2)}\n\n`;
                oResponseArea.setValue(oResponseArea.getValue() + line);
            }

            // Update progress indicator
            function updateProgress(status) {
                oProgress.setVisible(true);

                if (status === "PENDING" || status === "processing") {
                    oProgress.setPercentValue(50);
                    oProgress.setState("Information");
                    oProgress.setDisplayValue("Processing...");
                } else if (status === "reviewNeeded") {
                    oProgress.setPercentValue(80);
                    oProgress.setState("Warning");
                    oProgress.setDisplayValue("Review needed");
                } else if (status === "confirmed" || status === "readyForPosting") {
                    oProgress.setPercentValue(100);
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Confirmed");
                } else if (status === "failed" || status === "ERROR" || status === "FAILED") {
                    oProgress.setPercentValue(100);
                    oProgress.setState("Error");
                    oProgress.setDisplayValue("Failed");
                } else if (status === "DONE" || status === "SUCCEEDED") {
                    oProgress.setPercentValue(100);
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Processing complete");
                } else {
                    oProgress.setPercentValue(70);
                    oProgress.setState("Information");
                    oProgress.setDisplayValue(status || "Processing");
                }
            }

            // Check document status
            function checkStatus() {
                if (!currentDocumentId) {
                    MessageBox.warning("No document ID available.");
                    return;
                }

                log("Checking status for: " + currentDocumentId, false);
                oBusyDialog.open();

                fetch(getApiBasePath() + "document/getDocAIStatus", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        documentId: currentDocumentId
                    })
                })
                .then(response => response.json())
                .then(data => {
                    oBusyDialog.close();
                    var newStatus = data.status;
                    currentDocumentStatus = newStatus;
                    log("Status retrieved: " + newStatus, false);
                    logJson("Status details", data);

                    updateProgress(newStatus);
                    updateButtonStates(newStatus);

                    if (newStatus === "DONE" || newStatus === "SUCCEEDED" || newStatus === "reviewNeeded") {
                        MessageBox.success("Document processing completed!");
                    } else if (newStatus === "FAILED" || newStatus === "ERROR") {
                        MessageBox.error("Document processing failed");
                    }
                })
                .catch(error => {
                    oBusyDialog.close();
                    log("Status check failed: " + error.message, true);
                    MessageToast.show("Status check failed");
                });
            }

            // Get confidence state
            function getConfidenceState(confidence) {
                if (confidence < 0.5) return "Error";
                if (confidence < 0.8) return "Warning";
                return "Success";
            }

            // Fetch schema field definitions
            function fetchSchemaFields(schemaVersionId) {
                log("Fetching schema fields for version ID: " + schemaVersionId, false);

                return fetch(getApiBasePath() + "document/getSchemaFields", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        schemaVersionId: schemaVersionId
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        schemaFields = {};
                        var fields = (data.fields || []).map(f => JSON.parse(f));
                        if (fields.length > 0) {
                            fields.forEach(field => {
                                schemaFields[field.name] = {
                                    label: field.label || field.name,
                                    dataType: field.dataType,
                                    ID: field.ID
                                };
                            });
                            log("Loaded " + fields.length + " schema field definitions", false);
                        }
                        return schemaFields;
                    })
                    .catch(error => {
                        log("Failed to fetch schema fields: " + error.message, true);
                        throw error;
                    });
            }

            // Fetch document extraction results
            function fetchDocumentEntities(documentId) {
                log("Fetching document entities for ID: " + documentId, false);

                return fetch(getApiBasePath() + "document/getDocAIResults", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        documentId: documentId
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            throw new Error(data.error.message || "Failed to fetch results");
                        }

                        // Store file data
                        if (data.fileData) {
                            pdfData = data.fileData;
                            log("File data loaded", false);
                        }

                        // Store extraction source
                        extractionSource = data.extractionSource || 'api';

                        // Store structured format
                        if (data.headerFields && data.lineItems) {
                            log("Loaded " + data.headerFields.length + " header fields and " + data.lineItems.length + " line items", false);
                            log("Extraction source: " + extractionSource, false);

                            return {
                                headerFields: data.headerFields,
                                lineItems: data.lineItems,
                                parentEntities: data.parentEntities || {},
                                documentConfidence: data.documentConfidence,
                                extractionSource: extractionSource,
                                fileName: data.fileName,
                                mimeType: data.mimeType
                            };
                        } else {
                            log("No structured data found in response", true);
                        }

                        return {
                            headerFields: [],
                            lineItems: [],
                            parentEntities: {},
                            documentConfidence: 0,
                            extractionSource: 'unknown',
                            fileName: data.fileName,
                            mimeType: data.mimeType
                        };
                    })
                    .catch(error => {
                        log("Failed to fetch document entities: " + error.message, true);
                        throw error;
                    });
            }

            // Build extraction results content
            function buildResultsContent() {
                oExtractionResultsContent.destroyItems();
                editedEntities = {};

                // Check if document is confirmed (read-only mode)
                var isConfirmed = currentDocumentStatus === "confirmed" || currentDocumentStatus === "readyForPosting";

                // Document confidence
                var docConfidence = documentEntities.documentConfidence || 0;
                var docConfidenceText = Math.round(docConfidence * 100) + "%";
                var docConfidenceState = getConfidenceState(docConfidence);

                var oDocConfidenceStatus = new ObjectStatus({
                    text: "Document Confidence: " + docConfidenceText,
                    state: docConfidenceState
                });

                oExtractionResultsContent.addItem(oDocConfidenceStatus);
                oExtractionResultsContent.addItem(new Text({ text: "" }).addStyleClass("sapUiSmallMarginTop"));

                var headerFields = documentEntities.headerFields || [];
                var lineItems = documentEntities.lineItems || [];
                var parentEntities = documentEntities.parentEntities || {};

                // Group header fields by parent_ID (for groups)
                var ungroupedFields = [];
                var groupedFields = {};

                headerFields.forEach(function(field) {
                    if (field.parent_ID) {
                        if (!groupedFields[field.parent_ID]) {
                            groupedFields[field.parent_ID] = [];
                        }
                        groupedFields[field.parent_ID].push(field);
                    } else {
                        ungroupedFields.push(field);
                    }
                });

                // Render ungrouped fields first
                if (ungroupedFields.length > 0) {
                    renderFieldGroup("Document Fields", ungroupedFields, isConfirmed);
                }

                // Render each group using parent entity label
                Object.keys(groupedFields).forEach(function(groupId) {
                    var parentEntity = parentEntities[groupId];
                    var groupLabel = parentEntity ? (parentEntity.label || parentEntity.name) : "Group " + groupId.substring(0, 8);
                    renderFieldGroup(groupLabel, groupedFields[groupId], isConfirmed);
                });

                // Render line items (tables)
                if (lineItems.length > 0) {
                    renderLineItemsTable(lineItems, isConfirmed);
                }
            }

            // Helper function to render a group of fields
            function renderFieldGroup(groupTitle, fields, isConfirmed) {
                var oGroupPanel = new Panel({
                    headerText: groupTitle + " (" + fields.length + " fields)",
                    expandable: true,
                    expanded: true,
                    content: new VBox({ items: [] })
                }).addStyleClass("sapUiSmallMarginTop");

                var oGroupContent = oGroupPanel.getContent()[0];

                fields.forEach(function(entity) {
                    var fieldDef = schemaFields[entity.name] || {};
                    var fieldLabel = entity.label || fieldDef.label || entity.name;
                    var dataType = entity.dataType || fieldDef.dataType;

                    var fieldValue = "";
                    if (dataType === "Number") {
                        fieldValue = entity.numberValue !== null && entity.numberValue !== undefined ? String(entity.numberValue) : "";
                    } else if (dataType === "Date") {
                        fieldValue = entity.dateValue || "";
                    } else {
                        fieldValue = entity.stringValue || "";
                    }

                    var oFieldInput = new Input({
                        value: fieldValue,
                        width: "100%",
                        editable: !isConfirmed,
                        change: (function(ent, origVal) {
                            return function(oEvent) {
                                var newValue = oEvent.getParameter("value");
                                editedEntities[ent.ID] = {
                                    entity: ent,
                                    originalValue: origVal,
                                    editedValue: newValue,
                                    modified: newValue !== origVal
                                };
                            };
                        })(entity, fieldValue)
                    });

                    var confidence = entity.confidence || 0;
                    var confidenceText = Math.round(confidence * 100) + "%";
                    var confidenceState = getConfidenceState(confidence);

                    var oConfidenceStatus = new ObjectStatus({
                        text: confidenceText,
                        state: confidenceState,
                        width: "80px"
                    });

                    var oFieldRow = new HBox({
                        width: "100%",
                        alignItems: "Center",
                        items: [
                            new Label({
                                text: fieldLabel,
                                width: "200px"
                            }).addStyleClass("sapUiSmallMarginEnd"),
                            oFieldInput.setLayoutData(new FlexItemData({ growFactor: 1 })).addStyleClass("sapUiSmallMarginEnd"),
                            oConfidenceStatus
                        ]
                    }).addStyleClass("sapUiTinyMarginTop");

                    oGroupContent.addItem(oFieldRow);
                });

                oExtractionResultsContent.addItem(oGroupPanel);
            }

            // Helper function to render line items table
            function renderLineItemsTable(lineItems, isConfirmed) {
                var oLineItemsPanel = new Panel({
                    headerText: "Table (" + lineItems.length + " rows)",
                    expandable: true,
                    expanded: true,
                    content: new VBox({ items: [] })
                }).addStyleClass("sapUiSmallMarginTop");

                var oLineItemsContent = oLineItemsPanel.getContent()[0];

                // Get all unique field names from all line items
                var allFieldNames = [];
                var fieldNamesSet = {};
                lineItems.forEach(function(lineItem) {
                    var fields = lineItem.fields || [];
                    fields.forEach(function(field) {
                        if (!fieldNamesSet[field.name]) {
                            fieldNamesSet[field.name] = true;
                            allFieldNames.push({
                                name: field.name,
                                label: field.label || field.name
                            });
                        }
                    });
                });

                // Create table header
                var headerItems = [
                    new Label({ text: "#", width: "40px" }).addStyleClass("sapUiSmallMarginEnd")
                ];

                allFieldNames.forEach(function(fieldInfo, idx) {
                    headerItems.push(
                        new Label({
                            text: fieldInfo.label,
                            width: "150px"
                        }).addStyleClass(idx < allFieldNames.length - 1 ? "sapUiSmallMarginEnd" : "")
                    );
                });

                headerItems.push(
                    new Label({ text: "Confidence", width: "80px" })
                );

                var oHeaderRow = new HBox({
                    width: "100%",
                    items: headerItems
                }).addStyleClass("sapUiSmallMarginTop");

                oLineItemsContent.addItem(oHeaderRow);

                // Create table rows
                lineItems.forEach(function(lineItem) {
                    var occurrence = lineItem.occurrence;
                    var fields = lineItem.fields || [];

                    // Build field map by name
                    var fieldMap = {};
                    fields.forEach(function(f) {
                        fieldMap[f.name] = f;
                    });

                    var cells = [
                        new Text({ text: occurrence, width: "40px" }).addStyleClass("sapUiSmallMarginEnd")
                    ];

                    var avgConfidence = 0;
                    var confidenceCount = 0;

                    allFieldNames.forEach(function(fieldInfo, idx) {
                        var entity = fieldMap[fieldInfo.name];

                        if (entity) {
                            var dataType = entity.dataType;

                            var fieldValue = "";
                            if (dataType === "Number") {
                                fieldValue = entity.numberValue !== null && entity.numberValue !== undefined ? String(entity.numberValue) : "";
                            } else if (dataType === "Date") {
                                fieldValue = entity.dateValue || "";
                            } else {
                                fieldValue = entity.stringValue || "";
                            }

                            var oFieldInput = new Input({
                                value: fieldValue,
                                width: "150px",
                                editable: !isConfirmed,
                                change: (function(e, origVal) {
                                    return function(oEvent) {
                                        var newValue = oEvent.getParameter("value");
                                        editedEntities[e.ID] = {
                                            entity: e,
                                            originalValue: origVal,
                                            editedValue: newValue,
                                            modified: newValue !== origVal
                                        };
                                    };
                                })(entity, fieldValue)
                            }).addStyleClass(idx < allFieldNames.length - 1 ? "sapUiSmallMarginEnd" : "");

                            cells.push(oFieldInput);

                            if (entity.confidence !== null && entity.confidence !== undefined) {
                                avgConfidence += entity.confidence;
                                confidenceCount++;
                            }
                        } else {
                            cells.push(
                                new Input({
                                    value: "",
                                    width: "150px",
                                    enabled: false
                                }).addStyleClass(idx < allFieldNames.length - 1 ? "sapUiSmallMarginEnd" : "")
                            );
                        }
                    });

                    // Calculate average confidence for this line
                    var lineConfidence = confidenceCount > 0 ? avgConfidence / confidenceCount : 0;
                    var lineConfidenceText = Math.round(lineConfidence * 100) + "%";
                    var lineConfidenceState = getConfidenceState(lineConfidence);

                    cells.push(new ObjectStatus({
                        text: lineConfidenceText,
                        state: lineConfidenceState,
                        width: "80px"
                    }));

                    var oLineRow = new HBox({
                        width: "100%",
                        alignItems: "Center",
                        items: cells
                    }).addStyleClass("sapUiTinyMarginTop");

                    oLineItemsContent.addItem(oLineRow);
                });

                oExtractionResultsContent.addItem(oLineItemsPanel);
            }

            // Get extraction results
            function getResults() {
                if (!currentDocumentId) {
                    MessageBox.warning("No document ID available.");
                    return;
                }

                log("Fetching extraction results...", false);

                oPdfAndResultsContainer.setVisible(false);

                // If no schema version ID, try to get it from DocAI status
                var schemaPromise;
                if (!currentSchemaVersionId) {
                    log("No schema version ID, fetching from DocAI...", false);
                    schemaPromise = fetch(getApiBasePath() + "document/getDocAIStatus", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ documentId: currentDocumentId })
                    })
                    .then(response => response.json())
                    .then(data => {
                        var details = data.details ? JSON.parse(data.details) : {};
                        var schemaVersionId = details.schemaVersionId || details.schemaVersion?.ID;

                        if (schemaVersionId) {
                            log("Found schema version ID: " + schemaVersionId, false);
                            currentSchemaVersionId = schemaVersionId;
                            return schemaVersionId;
                        } else {
                            log("No schema version ID in DocAI response", true);
                            return null;
                        }
                    })
                    .catch(error => {
                        log("Failed to get schema from DocAI: " + error.message, true);
                        return null;
                    });
                } else {
                    schemaPromise = Promise.resolve(currentSchemaVersionId);
                }

                schemaPromise
                    .then(function(schemaVersionId) {
                        if (schemaVersionId) {
                            return fetchSchemaFields(schemaVersionId);
                        } else {
                            schemaFields = {};
                            return Promise.resolve();
                        }
                    })
                    .then(function() {
                        return fetchDocumentEntities(currentDocumentId);
                    })
                    .then(function(results) {
                        documentEntities = results;

                        // Store file metadata from response
                        currentFileName = results.fileName || "document";
                        currentMimeType = results.mimeType || "application/pdf";

                        // Update extraction source display
                        const sourceText = results.extractionSource === 'api' ? '📡 Data source: DocAI API' :
                                         results.extractionSource === 'callback' ? '📨 Data source: Callback (offline mode)' :
                                         results.extractionSource === 'local' ? '💾 Data source: Local (from callback, offline mode)' :
                                         '';
                        oExtractionSourceText.setText(sourceText);

                        if (!results || (!results.headerFields || results.headerFields.length === 0) && (!results.lineItems || results.lineItems.length === 0)) {
                            MessageBox.information("No extraction results found for this document.");
                            return;
                        }

                        buildResultsContent();

                        // Display file if available
                        if (pdfData) {
                            log("Displaying file: " + currentFileName + " (" + currentMimeType + ")", false);

                            // Update panel header with filename
                            oPdfViewerPanel.setHeaderText("Document: " + currentFileName);

                            displayFile(pdfData, currentMimeType, currentFileName);
                        } else {
                            log("No file data available to display", false);
                        }

                        // Show the combined container
                        oExtractionResultsPanel.setVisible(true);
                        oPdfViewerPanel.setVisible(true);
                        oPdfAndResultsContainer.setVisible(true);

                        log("Extraction results displayed successfully", false);
                        MessageToast.show("Extraction results loaded");
                    })
                    .catch(function(error) {
                        log("Failed to get results: " + error.message, true);
                        MessageBox.error("Failed to get results: " + error.message);
                    });
            }

            // Display file based on type
            function displayFile(base64Data, mimeType, fileName) {
                if (!base64Data) {
                    log("No file data available", true);
                    return;
                }

                // Use setTimeout to ensure elements are in DOM and ready
                setTimeout(function() {
                    var fileContainer = document.getElementById("fileContainer");
                    if (!fileContainer) {
                        log("File container not found in DOM", true);
                        return;
                    }

                    try {
                        // Determine file type
                        var isImage = mimeType && (
                            mimeType.startsWith('image/') ||
                            /\.(jpe?g|png|gif|bmp|webp)$/i.test(fileName)
                        );
                        var isPdf = mimeType === 'application/pdf' || /\.pdf$/i.test(fileName);

                        if (isImage) {
                            // Display as image
                            fileContainer.innerHTML = '<img id="imageViewer" style="max-width:100%; height:auto; border:1px solid #ccc;" />';
                            var imgViewer = document.getElementById("imageViewer");
                            imgViewer.src = "data:" + (mimeType || "image/jpeg") + ";base64," + base64Data;
                            log("Image loaded in viewer (" + mimeType + ")", false);
                        } else if (isPdf) {
                            // Display as PDF in iframe
                            fileContainer.innerHTML = '<iframe id="pdfViewer" style="width:100%; height:800px; border:none;"></iframe>';
                            var pdfViewer = document.getElementById("pdfViewer");
                            pdfViewer.src = "data:application/pdf;base64," + base64Data;
                            log("PDF loaded in viewer", false);
                        } else {
                            // Provide download link for other file types
                            var downloadFileName = fileName || "document";
                            var dataUrl = "data:" + (mimeType || "application/octet-stream") + ";base64," + base64Data;
                            fileContainer.innerHTML =
                                '<div style="padding:20px; text-align:center;">' +
                                '<div style="margin-bottom:20px;">' +
                                '<span class="sapUiIcon sapUiIconDocument" style="font-size:48px; color:#0854a0;"></span>' +
                                '</div>' +
                                '<p style="font-size:14px; margin-bottom:10px;">File type: <strong>' + (mimeType || 'unknown') + '</strong></p>' +
                                '<p style="font-size:14px; margin-bottom:20px;">Filename: <strong>' + downloadFileName + '</strong></p>' +
                                '<a href="' + dataUrl + '" download="' + downloadFileName + '" style="display:inline-block; padding:10px 20px; background:#0854a0; color:white; text-decoration:none; border-radius:4px;">Download File</a>' +
                                '</div>';
                            log("Download link provided for file: " + downloadFileName + " (" + mimeType + ")", false);
                        }
                    } catch (error) {
                        log("Failed to display file: " + error.message, true);
                    }
                }, 100);
            }

            // Confirm document
            function confirmDocument() {
                if (!currentDocumentId) {
                    MessageBox.warning("No document ID available.");
                    return;
                }

                log("Starting confirmation workflow...", false);

                var modifiedEntityIds = Object.keys(editedEntities).filter(id => editedEntities[id].modified);

                // Prepare entities array for the action
                var entitiesPayload = modifiedEntityIds.map(entityId => {
                    var editInfo = editedEntities[entityId];
                    var entity = editInfo.entity;

                    var entityUpdate = {
                        entityId: entity.ID,
                        stringValue: null,
                        numberValue: null,
                        dateValue: null
                    };

                    // Set the appropriate value field based on dataType
                    if (entity.dataType === "Number") {
                        entityUpdate.numberValue = parseFloat(editInfo.editedValue) || 0;
                    } else if (entity.dataType === "Date") {
                        entityUpdate.dateValue = editInfo.editedValue;
                    } else {
                        entityUpdate.stringValue = editInfo.editedValue;
                    }

                    return entityUpdate;
                });

                if (entitiesPayload.length > 0) {
                    log("Updating " + entitiesPayload.length + " edited entities and confirming...", false);
                } else {
                    log("No edited entities, confirming document...", false);
                }

                // Call the CAP action that updates and confirms
                fetch(getApiBasePath() + "document/updateAndConfirmDocument", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        documentId: currentDocumentId,
                        entities: entitiesPayload,
                        useForInstantLearning: false
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error?.message || "Update and confirmation failed (HTTP " + response.status + ")");
                        });
                    }
                    return response.json();
                })
                .then(result => {
                    log("Document updated and confirmed successfully!", false);
                    logJson("Confirmation result", result);
                    MessageBox.success("Document updated and confirmed successfully!");

                    // Update status display
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Confirmed");

                    // Update button states
                    updateButtonStates("confirmed");
                })
                .catch(error => {
                    log("Confirmation failed: " + error.message, true);
                    MessageBox.error("Confirmation failed: " + error.message);
                });
            }

            // Enrich and auto-confirm document
            function enrichAndConfirm() {
                if (!currentDocumentId) {
                    MessageBox.warning("No document ID available.");
                    return;
                }

                log("Starting enrichment and auto-confirmation...", false);

                // First get the document status and result to build callback payload
                fetch(getApiBasePath() + "document/getDocAIStatus", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        documentId: currentDocumentId
                    })
                })
                .then(response => response.json())
                .then(statusData => {
                    log("Got document status for enrichment", false);

                    // Get document result
                    return fetch(getApiBasePath() + "document/getDocAIResults", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            documentId: currentDocumentId
                        })
                    })
                    .then(response => response.json())
                    .then(resultData => {
                        // Build callback-like payload
                        var callbackPayload = {
                            NotificationObjectId: currentDocumentId,
                            NotificationTargetStatus: "reviewNeeded",
                            DocumentResult: JSON.stringify({
                                documentVersions: [{
                                    version: 1,
                                    entities: []
                                }]
                            })
                        };

                        // Build entities from result data
                        var entities = [];
                        if (resultData.headerFields) {
                            resultData.headerFields.forEach(function(field) {
                                entities.push({
                                    ID: field.ID,
                                    name: field.name,
                                    label: field.label,
                                    type: "Field",
                                    stringValue: field.stringValue,
                                    numberValue: field.numberValue,
                                    dateValue: field.dateValue,
                                    confidence: field.confidence
                                });
                            });
                        }

                        callbackPayload.DocumentResult = JSON.stringify({
                            documentVersions: [{
                                version: 1,
                                entities: entities
                            }]
                        });

                        log("Calling enrichment endpoint...", false);

                        // Call enrichment endpoint
                        return fetch("./odata/v4/callback-enrich/callbackEnrich", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                payload: JSON.stringify(callbackPayload)
                            })
                        });
                    });
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error?.message || "Enrichment failed (HTTP " + response.status + ")");
                        });
                    }
                    return response.json();
                })
                .then(result => {
                    log("Enrichment completed: " + (result.value || JSON.stringify(result)), false);
                    MessageBox.success("Document enriched and confirmed successfully!");

                    // Update status display
                    oProgress.setState("Success");
                    oProgress.setDisplayValue("Enriched & Confirmed");

                    // Update button states
                    updateButtonStates("confirmed");

                    // Refresh results to show supplier ID
                    setTimeout(getResults, 1000);
                })
                .catch(error => {
                    log("Enrichment failed: " + error.message, true);
                    MessageBox.error("Enrichment failed: " + error.message);
                });
            }

            // Update button states based on status
            function updateButtonStates(status) {
                oCheckStatusButton.setEnabled(!!currentDocumentId);

                var canGetResults = !!currentDocumentId &&
                                  (status === "reviewNeeded" ||
                                   status === "DONE" ||
                                   status === "SUCCEEDED" ||
                                   status === "readyForPosting" ||
                                   status === "confirmed");
                oGetResultsButton.setEnabled(canGetResults);

                // Only enable Confirm and Enrich buttons if status is reviewNeeded (not confirmed or readyForPosting)
                var canConfirm = !!currentDocumentId && status === "reviewNeeded";
                oConfirmButton.setEnabled(canConfirm);
                oEnrichButton.setEnabled(canConfirm);
            }

            // Get Results button
            var oGetResultsButton = new Button({
                text: "Get Results",
                icon: "sap-icon://download",
                enabled: false,
                press: getResults
            });

            // Check Status button
            var oCheckStatusButton = new Button({
                text: "Check Status",
                icon: "sap-icon://refresh",
                enabled: false,
                press: checkStatus
            });

            // Status panel
            var oStatusPanel = new Panel({
                headerText: "Processing Status",
                expandable: true,
                expanded: true,
                width: "100%",
                content: new VBox({
                    items: [
                        oProgress,
                        oDocumentIdLink,
                        oExtractionSourceText,
                        new HBox({
                            items: [
                                oCheckStatusButton,
                                oGetResultsButton.addStyleClass("sapUiTinyMarginBegin")
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Response panel for logs
            var oResponsePanel = new Panel({
                headerText: "Document Log",
                expandable: true,
                expanded: true,
                width: "100%",
                content: new VBox({
                    items: [
                        oResponseArea
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginBottom");

            // Extraction Results panel
            var oExtractionResultsContent = new VBox({
                items: []
            }).addStyleClass("sapUiSmallMargin");

            var oConfirmButton = new Button({
                text: "Confirm",
                type: "Emphasized",
                icon: "sap-icon://accept",
                enabled: false,
                press: confirmDocument
            });

            var oEnrichButton = new Button({
                text: "Enrich+auto-confirm",
                type: "Emphasized",
                icon: "sap-icon://enrichment",
                enabled: false,
                press: enrichAndConfirm
            }).addStyleClass("sapUiTinyMarginBegin");

            var oExtractionResultsPanel = new Panel({
                headerText: "Extraction Results",
                expandable: true,
                expanded: true,
                visible: false,
                content: new VBox({
                    items: [
                        oExtractionResultsContent,
                        new HBox({
                            alignItems: "Center",
                            items: [
                                oConfirmButton,
                                oEnrichButton
                            ]
                        }).addStyleClass("sapUiSmallMarginTop")
                    ]
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginStart");

            // PDF Viewer panel (now supports multiple file types)
            var oPdfViewerPanel = new Panel({
                headerText: "Document",
                expandable: true,
                expanded: true,
                visible: false,
                content: new HTML({
                    content: '<div id="fileContainer" style="width:100%; min-height:800px;"></div>'
                }).addStyleClass("sapUiSmallMargin")
            }).addStyleClass("sapUiSmallMarginEnd");

            // Combined PDF and Extraction Results container
            var oPdfAndResultsContainer = new HBox({
                width: "100%",
                visible: false,
                justifyContent: "SpaceBetween",
                items: [
                    oPdfViewerPanel.setLayoutData(new FlexItemData({ growFactor: 1 })),
                    oExtractionResultsPanel.setLayoutData(new FlexItemData({ growFactor: 1 }))
                ]
            }).addStyleClass("sapUiSmallMarginBottom");

            // Main content
            var oMainContent = new VBox({
                width: "100%",
                items: [
                    new HBox({
                        width: "100%",
                        justifyContent: "SpaceBetween",
                        alignItems: "Center",
                        items: [
                            new Title({
                                text: "Document Validation",
                                level: "H2"
                            }),
                            new Button({
                                text: "Back to Monitoring",
                                icon: "sap-icon://nav-back",
                                press: function() {
                                    window.location.href = './monitoring.html';
                                }
                            })
                        ]
                    }).addStyleClass("sapUiMediumMarginTop sapUiSmallMarginBottom"),
                    oStatusPanel,
                    oPdfAndResultsContainer,
                    oResponsePanel
                ]
            }).addStyleClass("sapUiContentPadding");

            // Create page
            var oPage = new Page({
                title: "Document Validation - DocAI",
                showHeader: true,
                showNavButton: true,
                navButtonPress: function() {
                    window.location.href = "./monitoring.html";
                },
                content: [oMainContent]
            });

            // Create app
            var oApp = new App({
                pages: [oPage]
            });

            oApp.placeAt("content");

            // Initialize on load
            if (urlDocId) {
                currentDocumentId = urlDocId;
                var docaiUrl = "https://docai-workshop.eu10.doc.cloud.sap/workspace#/Documents(" + currentDocumentId + ")";
                oDocumentIdLink.setText("Document ID: " + currentDocumentId);
                oDocumentIdLink.setHref(docaiUrl);
                log("Loaded document ID from URL: " + currentDocumentId, false);

                // Check status immediately
                checkStatus();
            } else {
                MessageBox.error("No document ID provided in URL. Please use ?docId={uuid} or ?docaiDocumentId={guid}");
                log("ERROR: No document ID in URL parameters", true);
            }
        }, function(err) {
            console.error("UI5 module loading failed:", err);
            document.body.innerHTML = '<div style="padding:20px;color:red;">Error loading UI5 framework. Please check console and refresh.</div>';
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>
</html>
