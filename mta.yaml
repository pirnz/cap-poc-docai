_schema-version: 3.3.0
ID: cap-poc-docai
version: 1.0.0
description: "CAP DocAI Integration with Callback Support"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        - cp -r db.sqlite gen/srv
modules:
  - name: cap-poc-docai-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    properties:
      DOCAI_UI_URL: https://docai-workshop.eu10.doc.cloud.sap/workspace
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cap-poc-docai-auth
      - name: cap-poc-docai-destination

  - name: cap-poc-docai-app
    type: html5
    path: ./app
    build-parameters:
      build-result: .
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []

  - name: cap-poc-docai-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: cap-poc-docai-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - cap-poc-docai-app.zip
          name: cap-poc-docai-app
          target-path: resources/

  - name: cap-poc-docai-destinations
    type: com.sap.application.content
    requires:
      - name: cap-poc-docai-auth
        parameters:
          service-key:
            name: cap-poc-docai-auth-key
      - name: cap-poc-docai-html5-repo-host
        parameters:
          service-key:
            name: cap-poc-docai-html5-repo-host-key
      - name: srv-api
      - name: cap-poc-docai-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: cap-poc-docai-html5-repository
              ServiceInstanceName: cap-poc-docai-html5-repo-host
              ServiceKeyName: cap-poc-docai-html5-repo-host-key
              sap.cloud.service: cappocdocai.service
            - Name: cap-poc-docai-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cap-poc-docai-auth
              ServiceKeyName: cap-poc-docai-auth-key
              sap.cloud.service: cappocdocai.service
            - Name: cap-docai-poc-dest
              Authentication: OAuth2ClientCredentials
              ServiceInstanceName: cap-poc-docai-auth
              ServiceKeyName: cap-poc-docai-auth-key
              sap.cloud.service: cappocdocai.service
              URL: ~{srv-api/srv-url}

  # DocAI Callback Destination
  - name: cap-poc-docai-callback-destination
    type: com.sap.application.content
    requires:
      - name: cap-poc-docai-auth
        parameters:
          service-key:
            name: callback-destination-key
      - name: cap-poc-docai-destination
        parameters:
          content-target: true
      - name: srv-api
    parameters:
      content:
        subaccount:
          destinations:
            # Destination for DocAI to call back with extraction results
            - Authentication: OAuth2ClientCredentials
              HTML5.DynamicDestination: true
              Name: DOC_AI_cap-poc-docai
              ServiceInstanceName: cap-poc-docai-auth
              ServiceKeyName: callback-destination-key
              # Callback endpoint URL: <srv-url>/odata/v4/callback/callback
              URL: ~{srv-api/srv-url}/odata/v4/callback/callback
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: cap-poc-docai-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cap-poc-docai-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"

  - name: cap-poc-docai-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api

  - name: cap-poc-docai-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
