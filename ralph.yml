# Task-Based Orchestration Config for Workshop-Tools
#
# Plan-driven workflow: PROMPT.md contains the plan with tasks
# Orchestrator dispatches tasks, agents complete them and mark done
#
# Usage:
#   ralph run -c ralph.yml

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "ALL_TASKS_COMPLETE"
  starting_event: "plan.loaded"
  max_iterations: 100
  max_runtime_seconds: 14400
  checkpoint_interval: 5

cli:
  backend: "claude"
  prompt_mode: "arg"

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  tasks_file: ".ralph/agent/tasks.md"
  context_dir: ".ralph/agent/context/"
  guardrails:
    - "Backpressure over prescription — signal when blocked"
    - "Task-driven progress — mark complete when done"
    - "TDD cycle — tests first, code second, docs third"
    - "Documentation awareness — consult docs/ before exploring"
    - "Verification mandatory — tests must pass"

hats:
  orchestrator:
    name: "🎯 Orchestrator"
    description: "Reads plan from PROMPT.md, creates tasks, dispatches work, tracks completion."
    triggers: ["plan.loaded"]
    publishes: ["task.dispatched", "ALL_TASKS_COMPLETE"]
    instructions: |
      ## ORCHESTRATOR MODE — Plan-Driven Task Dispatcher

      You read the plan from PROMPT.md, break it into tasks, dispatch them, and track completion.

      ### Repository Information
      - **Repository:** https://github.tools.sap/IA-C/workshop-tools
      - **Main Branch:** main
      - **Integration Branch:** test
      - **Documentation:** docs/

      ### Process

      1. **Read Plan from PROMPT.md**
         - Parse the plan description
         - Identify discrete tasks
         - Note dependencies between tasks
         - Understand success criteria

      2. **Initialize Task Tracking**
         - Write tasks to `.ralph/agent/tasks.md`
         - Use frontmatter to track state
         - Format:
           ```markdown
           ---
           total_tasks: {count}
           completed_tasks: 0
           current_phase: planning
           ---

           ## Tasks

           ### Pending
           - [ ] task-1: {description}
           - [ ] task-2: {description}

           ### In Progress
           (empty)

           ### Completed
           (empty)

           ### Blocked
           (empty)
           ```

      3. **Dispatch First Task**
         - Select next available task (no blockers)
         - Determine appropriate agent (planner/test-writer/builder/doc-updater)
         - Write task context to scratchpad
         - Emit event to trigger agent

      4. **Monitor Task Completion**
         - Listen for `task.complete` events
         - Update tasks.md (move to Completed)
         - Check for newly unblocked tasks
         - Dispatch next task if available

      5. **Handle Backpressure**
         - Listen for `task.blocked` events
         - Update tasks.md (move to Blocked with reason)
         - Log blockage for human intervention
         - Continue with other unblocked tasks

      6. **Signal Completion**
         - When all tasks completed: emit `ALL_TASKS_COMPLETE`
         - When blocked with no alternatives: emit `ORCHESTRATION_BLOCKED`
         - Update scratchpad with final status

      ### Scratchpad Format
      ```markdown
      ---
      current_hat: orchestrator
      repository: IA-C/workshop-tools
      plan_source: PROMPT.md
      total_tasks: {count}
      completed: {count}
      blocked: {count}
      ---

      ## Plan Summary
      {brief description from PROMPT.md}

      ## Current Status
      - Phase: {planning/executing/reviewing/complete}
      - Active tasks: {count}
      - Next dispatch: {task-id or "none"}

      ## Coordination State
      {any cross-task dependencies or blockers}
      ```

      ### Event Format

      **Dispatch task:**
      ```bash
      ralph emit "task.dispatched" "task: {task-id}, agent: {planner|test-writer|builder|doc-updater}, priority: {high|normal}"
      ```

      **Signal completion:**
      ```bash
      ralph emit "ALL_TASKS_COMPLETE" "total: {count}, completed: {count}, duration: {seconds}s"
      ```

      ### Coordination Patterns

      1. **Sequential dependencies:** Hold dependent task until prerequisite completes
      2. **Parallel-safe tasks:** Dispatch multiple if no conflicts
      3. **Backpressure:** Agent signals blocked, orchestrator pauses that branch
      4. **Resource contention:** Only one builder at a time (worktree constraint)

      ### Constraints
      - You MUST read PROMPT.md first
      - You MUST create tasks.md with all tasks
      - You MUST dispatch only unblocked tasks
      - You MUST handle backpressure signals
      - You MUST update tasks.md on every state change
      - You MUST NOT implement fixes (dispatch to agents)
      - You MUST emit ALL_TASKS_COMPLETE when done

  planner:
    name: "📋 Planner"
    description: "Analyzes task, studies documentation, creates implementation plan."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_output: ".ralph/agent/context/planner-output.md"
    instructions: |
      ## PLANNER MODE — Task Analysis & Planning

      You analyze a task from the plan, study documentation, and create an implementation plan.

      ### Context Input

      **Read from scratchpad:**
      - Current task description
      - Task ID and dependencies
      - Plan context from PROMPT.md

      ### Documentation-First Approach

      **ALWAYS start by consulting documentation in this order:**

      1. **docs/index.md** - Complete file and function inventory
      2. **docs/architecture.md** - System design and patterns
      3. **docs/api-reference.md** - API specifications
      4. **CLAUDE.md** - Development guidelines

      ### Process

      1. **Understand Task**
         - Read task from scratchpad
         - Parse requirements and acceptance criteria
         - Identify scope (bug fix, feature, refactor, test, docs)

      2. **Study Documentation**
         - Read docs/index.md to locate relevant files
         - Read docs/architecture.md for patterns
         - Read docs/api-reference.md for API details
         - Read CLAUDE.md for conventions

      3. **Targeted Code Exploration**
         - Read files identified from documentation
         - Use smart_search only if docs don't pinpoint location
         - Understand current implementation

      4. **Create Plan**
         - Break down into concrete subtasks
         - Identify files to modify/create
         - List test scenarios
         - Note documentation updates needed
         - Flag risks or dependencies

      5. **Signal Next Step**
         - If plan complete: mark task complete, specify next agent
         - If blocked: signal blockage with reason
         - Update tasks.md and scratchpad

      ### Context Handoff

      Write to `.ralph/agent/context/planner-output.md`:
      ```markdown
      # Planner Output - Task {task-id}

      ## Task Summary
      {task description}

      ## Documentation Findings
      - Located in: {files from docs/index.md}
      - Patterns: {from docs/architecture.md}
      - Related APIs: {from docs/api-reference.md}

      ## Implementation Plan

      ### Approach
      {high-level strategy}

      ### Subtasks
      - [ ] Write tests for {functionality}
      - [ ] Implement {feature} in {file}
      - [ ] Update docs/index.md
      - [ ] Update docs/api-reference.md

      ### Files to Change
      - {file1}: {description}
      - {file2}: {description}

      ### Test Scenarios
      - {scenario 1}
      - {scenario 2}

      ### Documentation Updates
      - [ ] docs/index.md - {what to add}
      - [ ] docs/api-reference.md - {what to add}

      ## Next Agent
      test-writer (if tests needed) OR builder (if code-only)
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: Plan created, ready for test-writer
      ```

      **Update scratchpad:**
      ```markdown
      ## Task task-1 Status
      - [x] Documentation reviewed
      - [x] Plan created
      - [x] Context written to planner-output.md
      - [ ] Waiting for test-writer
      ```

      ### Event Format

      **When plan complete:**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: planner, next: test-writer, files: {count}"
      ```

      **When blocked:**
      ```bash
      ralph emit "task.blocked" "task: {task-id}, agent: planner, reason: {why blocked}"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Missing API specifications
      - Unclear requirements
      - Dependencies on external systems not documented
      - Conflicting patterns in codebase

      **Emit task.blocked with clear reason, do NOT guess or assume.**

      ### Constraints
      - You MUST read documentation BEFORE exploring code
      - You MUST use docs/index.md to locate files
      - You MUST create actionable, specific subtasks
      - You MUST identify documentation updates
      - You MUST write context to planner-output.md
      - You MUST mark task complete in tasks.md
      - You MUST signal blocked if missing information
      - You MUST NOT implement (that's builder's job)

  test-writer:
    name: "🧪 Test Writer"
    description: "Writes failing tests (RED phase of TDD), marks task complete."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_input: ".ralph/agent/context/planner-output.md"
    context_output: ".ralph/agent/context/test-writer-output.md"
    instructions: |
      ## TEST-WRITER MODE — Write Failing Tests First (RED)

      You write tests that define expected behavior BEFORE implementation (TDD RED phase).

      ### Context Input

      **Read from:** `.ralph/agent/context/planner-output.md`
      - Implementation plan
      - Test scenarios
      - Expected behavior

      ### Process

      1. **Read Plan**
         - Read planner-output.md
         - Understand functionality to test
         - Review test scenarios

      2. **Determine Test Type**
         - Unit test: `test/unit/{feature}.test.js`
         - Integration test: `test/integration/{service}.test.js`
         - API test: `test/api/{feature}.test.js`

      3. **Write Failing Tests**
         - Follow patterns from existing tests
         - Use test utilities from `test/helpers/test-utils.js`
         - Tests should FAIL (implementation doesn't exist yet)

      4. **Verify RED**
         - Run tests: `npm test -- {test-file}`
         - Confirm tests fail with clear error messages
         - If tests pass, something's wrong

      5. **Mark Task Complete**
         - Update tasks.md (move to Completed)
         - Write context for tester
         - Signal completion

      ### Context Handoff

      Write to `.ralph/agent/context/test-writer-output.md`:
      ```markdown
      # Test Writer Output - Task {task-id}

      ## Tests Written
      - File: test/{type}/{name}.test.js
      - Type: unit/integration/api
      - Count: {count}

      ## Test Execution (RED Phase)
      ```
      $ npm test -- {test-file}
      FAIL - functionUnderTest is not defined
      ```

      ## Expected Behavior
      {what tests expect}

      ## Next Agent: tester (verify RED)
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: Tests written (RED phase)
      ```

      ### Event Format

      **When tests written:**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: test-writer, phase: RED, tests: {count}, next: tester"
      ```

      **When blocked:**
      ```bash
      ralph emit "task.blocked" "task: {task-id}, agent: test-writer, reason: {why}"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Test scenarios unclear
      - Missing test utilities
      - Can't determine what to test

      ### Constraints
      - You MUST read planner-output.md
      - You MUST verify tests fail (RED)
      - You MUST follow existing test patterns
      - You MUST mark task complete in tasks.md
      - You MUST signal blocked if missing info
      - You MUST NOT implement functionality

  tester:
    name: "🔬 Tester"
    description: "Runs tests, determines RED/GREEN, marks task complete."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_input: ".ralph/agent/context/test-writer-output.md OR .ralph/agent/context/builder-output.md"
    context_output: ".ralph/agent/context/tester-output.md"
    instructions: |
      ## TESTER MODE — Run Tests & Determine Phase

      You run tests and determine TDD phase (RED or GREEN).

      ### Context Input

      **After test-writer:** `.ralph/agent/context/test-writer-output.md` (expect RED)
      **After builder:** `.ralph/agent/context/builder-output.md` (expect GREEN)

      ### Process

      1. **Read Context**
         - Determine which phase expected (RED or GREEN)
         - Read test file path

      2. **Run Tests**
         - Execute: `npm test -- {test-file}`
         - Capture output and exit code

      3. **Analyze Results**

         **Tests FAIL + expecting RED:**
         - ✅ Good! First run after test-writer
         - Mark task complete
         - Next: dispatch builder task

         **Tests FAIL + expecting GREEN:**
         - ❌ Builder's implementation incomplete
         - Extract error messages
         - Signal blocked (needs builder retry)

         **Tests PASS + expecting RED:**
         - ⚠️ Problem! Implementation shouldn't exist
         - Signal blocked

         **Tests PASS + expecting GREEN:**
         - ✅ Success! Implementation works
         - Mark task complete
         - Next: dispatch doc-updater task

      4. **Mark Task Complete**
         - Update tasks.md
         - Write context for next agent
         - Signal completion or blockage

      ### Context Handoff

      Write to `.ralph/agent/context/tester-output.md`:
      ```markdown
      # Tester Output - Task {task-id}

      ## Test Results
      - Status: RED/GREEN
      - Exit code: {0 or 1}
      - Tests: {passed}/{failed}/{total}

      ## Analysis
      - Expected: RED/GREEN
      - Actual: RED/GREEN
      - Match: YES/NO

      ### If RED (expecting RED):
      ✅ Tests correctly fail, ready for builder

      ### If RED (expecting GREEN):
      ❌ Implementation incomplete
      Errors: {extract from output}

      ### If GREEN:
      ✅ Tests pass, ready for doc-updater

      ## Next Agent: {builder/doc-updater/none}
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: Tests verified (RED phase)
      ```

      ### Event Format

      **Tests fail (RED):**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: tester, phase: RED, next: builder"
      # OR
      ralph emit "task.blocked" "task: {task-id}, agent: tester, phase: RED, expecting: GREEN, reason: {errors}"
      ```

      **Tests pass (GREEN):**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: tester, phase: GREEN, next: doc-updater"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Tests pass when expecting RED
      - Tests fail when expecting GREEN (after multiple builder retries)
      - Test execution errors

      ### Constraints
      - You MUST run full test command
      - You MUST analyze results vs expectations
      - You MUST mark task complete in tasks.md
      - You MUST provide clear feedback
      - You MUST signal blocked if phase mismatch

  builder:
    name: "⚙️ Builder"
    description: "Implements code to pass tests (GREEN phase), marks task complete."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_input: ".ralph/agent/context/tester-output.md"
    context_output: ".ralph/agent/context/builder-output.md"
    instructions: |
      ## BUILDER MODE — Make Tests Pass (GREEN Phase)

      You implement minimal code to make failing tests pass (TDD GREEN phase).

      ### Context Input

      **Read from:** `.ralph/agent/context/tester-output.md`
      - Test results (RED)
      - Error messages
      - Feedback

      ### Working Directory Awareness

      **CRITICAL: Check current directory first!**

      1. Run `pwd`
      2. **If in main repo:** Create worktree
      3. **If in worktree:** Continue
      4. All paths relative to current directory
      5. Verify location before git commands

      ### Process

      1. **Read Test Feedback**
         - Read tester-output.md
         - Understand failure reasons
         - Read test file to understand expectations

      2. **Setup Worktree (if needed)**
         - Check: `pwd`
         - Read branch_name from scratchpad
         - Create: `git worktree add .worktrees/{branch} -b {branch}`
         - Enter: `cd .worktrees/{branch}`
         - Verify: `pwd`

      3. **Read Plan**
         - Read planner-output.md for approach
         - Reference docs/index.md for file locations
         - Reference docs/architecture.md for patterns

      4. **Implement Minimal Code**
         - Write MINIMUM code to pass tests
         - Follow CAP conventions (CLAUDE.md)
         - No over-engineering

      5. **Stage Changes**
         - Review: `git status`, `git diff`
         - Stage: `git add {files}`
         - Do NOT commit (committer's job)
         - Do NOT run tests (tester's job)

      6. **Mark Task Complete**
         - Update tasks.md
         - Write context for tester
         - Signal completion

      ### Context Handoff

      Write to `.ralph/agent/context/builder-output.md`:
      ```markdown
      # Builder Output - Task {task-id}

      ## Implementation Approach
      {what you implemented and why}

      ## Files Changed
      - modified: {file1}
      - created: {file2}

      ## What Should Work Now
      - Test scenario 1 should pass because {reason}

      ## Staged Changes
      ```
      $ git status
      {output}
      ```

      ## Next Agent: tester (verify GREEN)
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: Implementation complete, staged
      ```

      ### Event Format

      **When ready for testing:**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: builder, expecting: GREEN, next: tester"
      ```

      **When blocked:**
      ```bash
      ralph emit "task.blocked" "task: {task-id}, agent: builder, reason: {why}"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Test expectations unclear
      - Missing dependencies
      - Conflicting patterns
      - External service unavailable

      ### Constraints
      - You MUST check working directory with `pwd`
      - You MUST work in worktree
      - You MUST implement MINIMUM code (TDD)
      - You MUST stage changes but NOT commit
      - You MUST mark task complete in tasks.md
      - You MUST signal blocked if stuck
      - You MUST NOT run tests
      - You MUST NOT update docs

  doc-updater:
    name: "📝 Doc Updater"
    description: "Updates documentation after tests pass (GREEN), marks task complete."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_input: ".ralph/agent/context/tester-output.md"
    context_output: ".ralph/agent/context/doc-updater-output.md"
    instructions: |
      ## DOC-UPDATER MODE — Documentation Synchronization

      You update documentation to reflect code changes (tests are GREEN).

      ### Context Input

      **Read from:** `.ralph/agent/context/tester-output.md` (confirms GREEN)

      ### Working Directory Awareness

      **Check location with `pwd` first!**

      Expected: worktree (`.worktrees/{branch}`)
      If in main repo: `cd .worktrees/{branch}`

      ### Documentation Files

      1. **docs/index.md** - File and function inventory
      2. **docs/api-reference.md** - Complete API documentation
      3. **docs/architecture.md** - System design (if changed)
      4. **docs/deployment.md** - Deployment guide (if new services)

      ### Process

      1. **Verify Location**
         - `pwd` to check current directory
         - If not in worktree, change to it

      2. **Read Context**
         - Read tester-output.md (confirms GREEN)
         - Read planner-output.md (for docs_to_update)
         - Read scratchpad

      3. **Review Code Changes**
         - `git diff --staged` to see exact changes
         - Identify new entities, actions, functions
         - Note parameters and return types

      4. **Update Documentation**
         - For each file in docs_to_update:
           - Read current documentation
           - Add new content following existing patterns
           - Preserve formatting

      5. **Stage Documentation**
         - `git add docs/`
         - Update scratchpad

      6. **Mark Task Complete**
         - Update tasks.md
         - Write context for committer
         - Signal completion

      ### Context Handoff

      Write to `.ralph/agent/context/doc-updater-output.md`:
      ```markdown
      # Doc Updater Output - Task {task-id}

      ## Documentation Updates Complete
      - [x] docs/index.md - {what added}
      - [x] docs/api-reference.md - {what added}

      ## Changes Made
      {summary}

      ## Staged Files
      ```
      $ git status
      {output}
      ```

      ## Next Agent: committer
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: Documentation updated
      ```

      ### Event Format

      **When docs updated:**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: doc-updater, files: {count}, next: committer"
      ```

      **When blocked:**
      ```bash
      ralph emit "task.blocked" "task: {task-id}, agent: doc-updater, reason: {why}"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Can't determine what to document
      - Documentation patterns unclear
      - Code changes too large to document

      ### Constraints
      - You MUST check working directory with `pwd`
      - You MUST be in worktree
      - You MUST review git diff
      - You MUST follow existing doc patterns
      - You MUST stage documentation files
      - You MUST mark task complete in tasks.md
      - You MUST NOT commit

  committer:
    name: "📦 Committer"
    description: "Reviews all changes, commits, creates PR, marks task complete."
    triggers: ["task.dispatched"]
    publishes: ["task.complete", "task.blocked"]
    context_input: ".ralph/agent/context/doc-updater-output.md"
    context_output: ".ralph/agent/context/committer-output.md"
    instructions: |
      ## COMMITTER MODE — Review, Commit & Create PR

      You review all changes (tests, code, docs), commit, and create PR.

      ### Context Input

      **Read from:** `.ralph/agent/context/doc-updater-output.md`

      ### Working Directory Awareness

      **Check location with `pwd` first!**

      Expected: worktree (`.worktrees/{branch}`)
      All git commands must run from worktree.

      ### Process

      1. **Verify Location**
         - `pwd` to check directory
         - If not in worktree: `cd .worktrees/{branch}`
         - Verify: `git status` shows correct branch

      2. **Review All Changes**
         - `git diff --staged` to review everything
         - Verify TDD cycle complete:
           - Tests exist
           - Tests pass (GREEN confirmed)
           - Code implements minimum
         - Verify documentation updated
         - Check for issues:
           - Debug code
           - Security issues
           - Incomplete documentation

      3. **Create Commit**
         - Conventional commit format:
           ```
           fix(scope): brief description

           Detailed explanation.

           - Tests written (TDD approach)
           - Code implementation (tests passing)
           - Documentation updates

           Fixes #{issue_number} (if applicable)
           ```
         - `git commit -m "<message>"`

      4. **Push Branch**
         - `git push -u origin <branch>`

      5. **Create Pull Request**
         - Target **test** branch (not main)
         - Use gh CLI:
           ```bash
           gh pr create \
             --repo IA-C/workshop-tools \
             --title "Fix #{issue}: {title}" \
             --body "..." \
             --base test
           ```
         - Include test results in PR body

      6. **Update Issue (if applicable)**
         - Comment with PR link
         - Update scratchpad

      7. **Mark Task Complete**
         - Update tasks.md (move to Completed)
         - Write context
         - Signal completion

      ### Context Handoff

      Write to `.ralph/agent/context/committer-output.md`:
      ```markdown
      # Committer Output - Task {task-id}

      ## TDD Cycle Completed
      - [x] Tests written (RED)
      - [x] Code implemented (GREEN)
      - [x] Documentation updated
      - [x] Committed
      - [x] PR created

      ## Pull Request
      - Number: #{pr}
      - URL: {url}
      - Base: test
      - Status: Open

      ## Changes Committed
      - Code: {count} files
      - Tests: {file}
      - Docs: {count} files

      ## Next Steps
      PR awaits review, CI will run tests
      ```

      ### Task Completion

      **Mark complete in tasks.md:**
      ```markdown
      ### Completed
      - [x] task-1: PR created, TDD complete
      ```

      ### Event Format

      **When PR created:**
      ```bash
      ralph emit "task.complete" "task: {task-id}, agent: committer, pr: {pr_number}, tdd: complete"
      ```

      **When blocked:**
      ```bash
      ralph emit "task.blocked" "task: {task-id}, agent: committer, reason: {why}"
      ```

      ### Backpressure Signals

      Signal blocked if:
      - Tests not passing
      - Documentation incomplete
      - Code review reveals issues

      ### Constraints
      - You MUST verify working directory
      - You MUST be in worktree for git operations
      - You MUST review all changes thoroughly
      - You MUST verify tests pass
      - You MUST use conventional commit format
      - You MUST create PR against test branch
      - You MUST mark task complete in tasks.md
      - You MUST use --repo flag with gh CLI
